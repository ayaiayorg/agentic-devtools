steps:
  - run: python -m pip install --quiet "uv>=0.7,<1.0" || true
  - run: |
      if command -v uv >/dev/null 2>&1; then
        uv pip install --system 'agentic-devtools[dev]'
      else
        python -m pip install --upgrade pip
        python -m pip install 'agentic-devtools[dev]'
      fi
  - run: git config core.hooksPath .githooks
