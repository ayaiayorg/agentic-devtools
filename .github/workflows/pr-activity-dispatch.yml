# PR Activity → Agent Session Monitor Dispatch
#
# Reacts to pull request events and triggers the Agent Session Monitor.
# Uses pull_request_target so it runs without approval even for Copilot PRs.
# Concurrency group ensures at most one in flight; throttle check ensures
# we don't dispatch if the monitor ran within the last 60 seconds.

name: PR Activity Dispatch

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review
      - review_requested
      - closed

permissions:
  actions: write

concurrency:
  group: pr-activity-dispatch
  cancel-in-progress: false

jobs:
  dispatch-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Throttle check
        id: throttle
        env:
          GH_TOKEN: ${{ secrets.AGDT_PR_APPROVER_PAT }}
        run: |
          set -euo pipefail

          COOLDOWN_SECONDS=60
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          # Get the most recent run of agent-session-monitor on the default branch (any status)
          LAST_RUN_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/agent-session-monitor.yml/runs?per_page=1&branch=${DEFAULT_BRANCH}" \
            --jq '.workflow_runs[0] // {}')

          LAST_RUN_STATUS=$(echo "$LAST_RUN_JSON" | jq -r '.status // empty')
          LAST_RUN_CONCLUSION=$(echo "$LAST_RUN_JSON" | jq -r '.conclusion // empty')
          LAST_RUN_END=$(echo "$LAST_RUN_JSON" | jq -r '.updated_at // empty')

          if [ -n "$LAST_RUN_STATUS" ] && [ "$LAST_RUN_STATUS" != "completed" ]; then
            echo "::notice::Throttled — agent-session-monitor is currently ${LAST_RUN_STATUS}"
            echo "throttled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If the last run completed but did not succeed, allow immediate retry.
          if [ -n "$LAST_RUN_CONCLUSION" ] && [ "$LAST_RUN_CONCLUSION" != "success" ]; then
            echo "Last monitor run concluded as '${LAST_RUN_CONCLUSION}' — proceeding with dispatch (no cooldown)."
            echo "throttled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$LAST_RUN_END" ]; then
            echo "No prior runs found — proceeding with dispatch."
            echo "throttled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_EPOCH=$(date -d "$LAST_RUN_END" +%s)
          NOW_EPOCH=$(date +%s)
          ELAPSED=$((NOW_EPOCH - LAST_EPOCH))

          echo "Last monitor run ended ${ELAPSED}s ago (cooldown=${COOLDOWN_SECONDS}s)"

          if [ "$ELAPSED" -lt "$COOLDOWN_SECONDS" ]; then
            echo "::notice::Throttled — last run ended ${ELAPSED}s ago, cooldown is ${COOLDOWN_SECONDS}s"
            echo "throttled=true" >> "$GITHUB_OUTPUT"
          else
            echo "throttled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Agent Session Monitor
        if: steps.throttle.outputs.throttled != 'true'
        env:
          GH_TOKEN: ${{ secrets.AGDT_PR_APPROVER_PAT }}
        run: |
          gh workflow run agent-session-monitor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}"
