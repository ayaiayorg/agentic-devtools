name: AI PR Loop

# PRIVILEGED workflow: handles push, approve, merge, review orchestration, and
# automated agentic repair.
# SECURITY: This workflow follows a two-phase trust model:
#   1. The ai-pr-loop job applies validated patch artifacts (plain text diffs) and
#      handles approve/merge decisions — no PR code is executed.
#   2. The agentic-repair job installs ALL trusted tooling (Python, agentic-devtools
#      from PyPI, ruff, markdownlint-cli2, Copilot CLI) BEFORE fetching the PR
#      branch. The PR branch is then fetched using explicit git commands (not
#      actions/checkout) with one-shot credentials and SHA verification. This
#      ensures: (a) untrusted PR code cannot influence tool installations,
#      (b) no opaque credential helpers or hooks interact with untrusted config,
#      (c) the fetched SHA is verified against the expected value (TOCTOU guard).
#      Agent prompts are sourced from a `main` branch checkout (__trusted_main/).
#      Fork PRs are blocked at the metadata step (line ~140).
# This two-workflow pattern is the CodeQL-recommended architecture for
# workflow_run triggers that need write permissions.

on:
  # Trigger 1: When the unprivileged lint workflow produces a patch.
  # NOTE: Only "AI PR Loop Lint" is listed here intentionally. This workflow
  # does not react to test/CI failures — those are handled by branch protection
  # rules. This workflow specifically handles lint-fix patches and Copilot review
  # orchestration (approve/merge when review is clean).
  workflow_run:
    workflows: ["AI PR Loop Lint"]
    types: [completed]
  # Trigger 2: When a Copilot review is submitted
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

env:
  # Pinned version of agentic-devtools installed by the repair job from PyPI.
  # This is the single source of truth — update here when upgrading.
  AGDT_VERSION: '0.42.0'

# Only one pipeline instance per PR runs at a time.
# Use a consistent key for both triggers: PR number (from review event) or
# the first associated PR number from workflow_run, falling back to branch.
concurrency:
  group: ai-pr-loop-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  ai-pr-loop:
    name: AI PR Loop
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      repair_needed: ${{ steps.dispatch-decision.outputs.repair_needed }}
      repair_type: ${{ steps.dispatch-decision.outputs.repair_type }}
      review_url: ${{ steps.dispatch-decision.outputs.review_url }}
      pr_number: ${{ steps.pr-meta.outputs.pr_number }}
      head_sha: ${{ steps.pr-meta.outputs.head_sha }}
      head_branch: ${{ steps.pr-meta.outputs.head_branch }}
      repair_comment_id: ${{ steps.dispatch-decision.outputs.repair_comment_id }}

    # Gate: only run for PR-related events
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_review' &&
       (github.event.review.user.login == 'Copilot' ||
        github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' ||
        (github.event.review.user.login == 'acmarsnik' &&
         contains(github.event.review.body || '', '<!-- synthetic-copilot-review -->'))))


    steps:
      # ─── Step 0: Resolve PR metadata ───────────────────────────────────────
      - name: Resolve PR metadata
        id: pr-meta
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber, headBranch, headSha;

            if (context.eventName === 'pull_request_review') {
              prNumber = context.payload.pull_request.number;
              headBranch = context.payload.pull_request.head.ref;
              headSha = context.payload.pull_request.head.sha;

              // FR-006 breadcrumb: log when triggered via pull_request_review while a
              // workflow-approval-fallback marker is present in the review body
              const reviewBody = context.payload.review.body || '';
              if (reviewBody.includes('<!-- workflow-approval-fallback -->')) {
                core.info('Proceeding via pull_request_review fallback — lint workflow in action_required state');
              }
            } else {
              // workflow_run event — find associated PR
              const workflowRun = context.payload.workflow_run;
              headBranch = workflowRun.head_branch;

              // Prefer the pull_requests array from the payload (deterministic,
              // avoids ambiguity when multiple PRs share the same head branch).
              if (workflowRun.pull_requests && workflowRun.pull_requests.length > 0) {
                prNumber = workflowRun.pull_requests[0].number;
                headSha = workflowRun.head_sha;
              } else {
                // Fallback: list open PRs by head branch
                const { data: pulls } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  head: `${context.repo.owner}:${headBranch}`,
                });

                if (pulls.length === 0) {
                  core.info('No open PR found for this workflow run — skipping.');
                  core.setOutput('should_proceed', 'false');
                  return;
                }

                prNumber = pulls[0].number;
                headSha = pulls[0].head.sha;
              }
            }

            core.setOutput('pr_number', prNumber);
            core.setOutput('head_branch', headBranch);
            core.setOutput('head_sha', headSha);

            // Check exclusion labels
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const labels = pr.labels.map(l => l.name);

            if (labels.includes('ai-pr-loop-ignore')) {
              core.info('PR has ai-pr-loop-ignore label — skipping entirely.');
              core.setOutput('should_proceed', 'false');
              return;
            }

            core.setOutput('should_proceed', 'true');
            core.setOutput('do_not_merge', labels.includes('do-not-auto-merge') ? 'true' : 'false');

            // Skip fork PRs — cannot push to forks
            if (pr.head.repo.full_name !== pr.base.repo.full_name) {
              core.info('PR is from a fork — skipping (cannot push to forks).');
              core.setOutput('should_proceed', 'false');
              return;
            }

      # ─── Trigger Guards ────────────────────────────────────────────────────
      - name: Check trigger guards
        id: guards
        if: steps.pr-meta.outputs.should_proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-meta.outputs.pr_number }}', 10);
            const headSha = '${{ steps.pr-meta.outputs.head_sha }}';

            // Check if Copilot review is currently in progress
            const allReviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const copilotLogin = 'copilot-pull-request-reviewer[bot]';
            const TRUSTED_SYNTHETIC_USERS = ['acmarsnik'];
            const SYNTHETIC_MARKER = '<!-- synthetic-copilot-review -->';
            const copilotReviewsOnHead = allReviews.filter(
              r => r.commit_id === headSha && r.user && (
                r.user.login === copilotLogin ||
                (TRUSTED_SYNTHETIC_USERS.includes(r.user.login) && (r.body || '').includes(SYNTHETIC_MARKER))
              )
            );

            // Check workflow run statuses (paginate to handle >100 check runs)
            const allCheckRuns = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                per_page: 100,
              },
              (response) => response.data.check_runs
            );

            const ciChecks = allCheckRuns.filter(
              cr => cr && cr.name !== 'AI PR Loop' &&
                    cr.name !== 'Generate lint fix patch'
            );
            const pendingChecks = ciChecks.filter(
              cr => cr.status !== 'completed'
            );
            let failedChecks = ciChecks.filter(
              cr => cr.status === 'completed' && cr.conclusion === 'failure'
            );

            if (context.eventName === 'workflow_run') {
              // Triggered by lint workflow completing — if a Copilot review already
              // exists on this commit and has changes requested, skip to avoid
              // conflicting with the review-triggered path.
              const changesRequested = copilotReviewsOnHead.some(
                r => r.state === 'CHANGES_REQUESTED'
              );
              if (changesRequested) {
                core.info('Copilot review has CHANGES_REQUESTED on head commit — skipping to let review trigger handle it.');
                core.setOutput('should_proceed', 'false');
                return;
              }
            }

            if (context.eventName === 'pull_request_review') {
              // Triggered by Copilot review — if PR checks still running, poll
              // until they complete (or job timeout). Without this, there is no
              // event to re-trigger the merge gate after checks finish.
              if (pendingChecks.length > 0) {
                core.info(`PR checks still running (${pendingChecks.length} pending) — polling until complete.`);
                const pollIntervalMs = 30_000; // 30 seconds
                const maxWaitMs = 10 * 60 * 1000; // 10 minutes (within job timeout)
                const startTime = Date.now();

                while (Date.now() - startTime < maxWaitMs) {
                  await new Promise(resolve => setTimeout(resolve, pollIntervalMs));

                  const freshCheckRuns = await github.paginate(
                    github.rest.checks.listForRef,
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: headSha,
                      per_page: 100,
                    },
                    (response) => response.data.check_runs
                  );

                  const freshCiChecks = freshCheckRuns.filter(
                    cr => cr && cr.name !== 'AI PR Loop' &&
                          cr.name !== 'Generate lint fix patch'
                  );
                  const stillPending = freshCiChecks.filter(cr => cr.status !== 'completed');

                  if (stillPending.length === 0) {
                    core.info('All CI checks completed — proceeding.');
                    // Update failedChecks from fresh data so the final output reflects post-wait state
                    failedChecks = freshCiChecks.filter(
                      cr => cr.status === 'completed' && cr.conclusion === 'failure'
                    );
                    if (failedChecks.length > 0) {
                      const names = failedChecks.map(c => `${c.name} (${c.conclusion})`).join(', ');
                      core.info(`Checks completed with failures: ${names}`);
                    }
                    break;
                  }

                  const elapsed = Math.round((Date.now() - startTime) / 1000);
                  core.info(`Still waiting for ${stillPending.length} check(s) (${elapsed}s elapsed)...`);
                }

                if (Date.now() - startTime >= maxWaitMs) {
                  core.info('Timed out waiting for checks to complete — skipping this trigger.');
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: [
                      '<!-- ai-pr-loop-timeout -->',
                      '⏱️ **AI PR Loop**: Timed out waiting for CI checks to complete (10 min limit).',
                      'The PR may become mergeable once checks finish — re-request a Copilot review or push a new commit to re-trigger.',
                      '',
                      `**Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                    ].join('\n'),
                  });
                  core.setOutput('should_proceed', 'false');
                  return;
                }
              }
            }

            // Check outer cycle count from the single tracker comment.
            // The tracker comment contains <!-- cycle-count: N --> for parsing.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const trackerComment = comments.find(
              c => c.body && c.body.includes('<!-- ai-pr-loop-cycle-tracker -->')
            );
            let cycleCount = 0;
            if (trackerComment) {
              const match = trackerComment.body.match(/<!-- cycle-count: (\d+) -->/);
              cycleCount = match ? parseInt(match[1], 10) : 0;
            }

            if (cycleCount >= 50) {
              core.info('Reached 50-cycle limit — posting failure comment and stopping.');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: [
                  '<!-- ai-pr-loop-exhausted -->',
                  '## ⚠️ AI PR Loop Exhausted',
                  '',
                  `The AI PR loop has reached the maximum of 50 cycles without achieving a mergeable state.`,
                  '',
                  `**Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                  '',
                  'Human intervention is required.',
                ].join('\n'),
              });
              core.setOutput('should_proceed', 'false');
              return;
            }

            core.setOutput('should_proceed', 'true');
            core.setOutput('has_failed_checks', failedChecks.length > 0 ? 'true' : 'false');
            core.setOutput('has_copilot_review', copilotReviewsOnHead.length > 0 ? 'true' : 'false');
            core.setOutput('cycle_count', cycleCount);

      # ─── Step 1: Download & Apply Lint Patch ───────────────────────────────
      # SECURITY: We download a patch artifact (plain text diff) produced by the
      # unprivileged "AI PR Loop Lint" workflow. We never check out or execute
      # PR code in this privileged workflow.
      - name: Download lint patch artifact
        id: download-patch
        if: >
          steps.pr-meta.outputs.should_proceed == 'true' &&
          steps.guards.outputs.should_proceed == 'true' &&
          github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;

            // List artifacts from the lint workflow run
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            const patchArtifact = artifacts.find(a => a.name === 'ai-pr-loop-lint-patch');
            if (!patchArtifact) {
              core.info('No lint patch artifact found — lint workflow produced no fixes.');
              core.setOutput('has_patch', 'false');
              return;
            }

            // Download the artifact
            const { data } = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: patchArtifact.id,
              archive_format: 'zip',
            });

            const fs = require('fs');
            fs.writeFileSync('/tmp/patch-artifact.zip', Buffer.from(data));
            core.setOutput('has_patch', 'true');

      - name: Extract and validate patch
        id: validate-patch
        if: steps.download-patch.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/patch-content
          unzip -o /tmp/patch-artifact.zip -d /tmp/patch-content

          # Validate PR metadata matches current PR
          PATCH_PR=$(cat /tmp/patch-content/pr-meta/pr_number 2>/dev/null || echo "")
          PATCH_SHA=$(cat /tmp/patch-content/pr-meta/head_sha 2>/dev/null || echo "")
          EXPECTED_PR="${{ steps.pr-meta.outputs.pr_number }}"
          EXPECTED_SHA="${{ steps.pr-meta.outputs.head_sha }}"

          if [ "$PATCH_PR" != "$EXPECTED_PR" ]; then
            echo "Patch PR ($PATCH_PR) doesn't match current PR ($EXPECTED_PR) — skipping."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PATCH_SHA" != "$EXPECTED_SHA" ]; then
            echo "Patch SHA ($PATCH_SHA) doesn't match current head ($EXPECTED_SHA) — stale patch, skipping."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f /tmp/patch-content/lint-fixes.patch ]; then
            echo "No patch file found in artifact — skipping."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Basic safety check: patch should only contain diff data, not scripts
          if grep -qP '^\+.*\b(eval|exec|import os|subprocess)\b' /tmp/patch-content/lint-fixes.patch 2>/dev/null; then
            echo "::warning::Patch contains potentially dangerous content — review manually."
          fi

          # Extract ALL modified paths from the patch (additions, modifications,
          # deletions, and renames). Deletions use "+++ /dev/null" so we must also
          # parse "--- a/" lines. Exclude /dev/null itself.
          ALL_PATHS=$(grep -E '^(\+\+\+ b/|--- a/)' /tmp/patch-content/lint-fixes.patch \
            | sed -E 's#^\+\+\+ b/##' \
            | sed -E 's#^--- a/##' \
            | grep -v '^/dev/null$' \
            | sort -u)

          # Strict file-path allowlisting: reject patches touching privileged paths.
          # Exception: markdown files (.md) under these paths are safe (e.g. README.md).
          DISALLOWED_PATHS=$(echo "$ALL_PATHS" | grep -E '^\.github/(workflows|actions|scripts)/' | grep -vE '\.md$' || true)
          if [ -n "$DISALLOWED_PATHS" ]; then
            echo "::error::Patch modifies privileged paths — rejecting for security:"
            echo "$DISALLOWED_PATHS"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only allow patches to known safe file extensions
          DISALLOWED_EXTENSIONS=$(echo "$ALL_PATHS" | grep -vE '\.(py|md|txt|toml|cfg|ini|yaml|yml|json|rst)$' || true)
          if [ -n "$DISALLOWED_EXTENSIONS" ]; then
            echo "::error::Patch modifies files with non-allowlisted extensions — rejecting:"
            echo "$DISALLOWED_EXTENSIONS"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "Patch validated successfully."

      # Checkout the PR branch via the GitHub API (merge ref) to apply the patch.
      # We use the TRUSTED default branch checkout + git fetch pattern.
      - name: Checkout repository (trusted base)
        if: steps.validate-patch.outputs.valid == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Apply patch to PR branch
        id: apply-patch
        if: steps.validate-patch.outputs.valid == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ steps.pr-meta.outputs.head_branch }}
        run: |
          set -euo pipefail

          # Configure git with token for push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Fetch PR branch
          git fetch --depth=2 origin "${PR_BRANCH}"
          git checkout -B "${PR_BRANCH}" "origin/${PR_BRANCH}"

          # Apply the patch
          if git apply --check /tmp/patch-content/lint-fixes.patch 2>/dev/null; then
            git apply /tmp/patch-content/lint-fixes.patch
            git add -A
            git commit --amend --no-edit
            git push --force-with-lease origin HEAD
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Patch applied and pushed successfully."
          else
            echo "::warning::Patch does not apply cleanly — PR may have been updated since lint ran."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # After pushing a lint-fix patch, the new HEAD has no Copilot review.
      # Re-request one so the PR doesn't get stuck waiting for a manual request.
      - name: Re-request Copilot review after patch push
        if: steps.apply-patch.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-meta.outputs.pr_number }}', 10);
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: ['Copilot'],
              });
              core.info(`Re-requested Copilot review for PR #${prNumber} after patch push.`);
            } catch (error) {
              core.warning(`Failed to request Copilot review (best-effort): ${error.message}`);
            }

      # ─── Step 2: Handle Copilot Review Comments ────────────────────────────
      - name: Check for addressable Copilot review comments
        id: check-review
        if: >
          steps.pr-meta.outputs.should_proceed == 'true' &&
          steps.guards.outputs.should_proceed == 'true' &&
          steps.guards.outputs.has_copilot_review == 'true' &&
          steps.apply-patch.outputs.pushed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-meta.outputs.pr_number }}', 10);
            const headSha = '${{ steps.pr-meta.outputs.head_sha }}';
            const copilotLogin = 'copilot-pull-request-reviewer[bot]';
            const TRUSTED_SYNTHETIC_USERS = ['acmarsnik'];
            const SYNTHETIC_MARKER = '<!-- synthetic-copilot-review -->';

            // Get Copilot reviews on the head commit
            const allReviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const copilotReviews = allReviews.filter(
              r => r.commit_id === headSha && r.user && (
                r.user.login === copilotLogin ||
                (TRUSTED_SYNTHETIC_USERS.includes(r.user.login) && (r.body || '').includes(SYNTHETIC_MARKER))
              )
            );
            // Sort by submitted_at descending so the first element is the most recent
            copilotReviews.sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

            if (copilotReviews.length === 0) {
              core.setOutput('has_comments', 'false');
              return;
            }

            // Only evaluate the LATEST Copilot review on this commit.
            // Earlier reviews may have stale comments that were addressed;
            // only the most recent review reflects the current state.
            const latestReview = copilotReviews[0];
            const reviewComments = await github.paginate(
              github.rest.pulls.listCommentsForReview,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                review_id: latestReview.id,
                per_page: 100,
              }
            );

            core.info(`Latest Copilot review (${latestReview.id}) state=${latestReview.state}, ${reviewComments.length} comment(s).`);
            core.setOutput('review_state', latestReview.state || '');
            // FR-001: "actionable" means CHANGES_REQUESTED with inline comments
            const isActionable = latestReview.state === 'CHANGES_REQUESTED' && reviewComments.length > 0;
            core.setOutput('has_comments', isActionable ? 'true' : 'false');
            core.setOutput('review_id', String(latestReview.id));
            core.setOutput('review_url', `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}#pullrequestreview-${latestReview.id}`);

      # ─── Step 2b: Dispatch Decision ──────────────────────────────────────
      # Decides whether to dispatch the agentic-repair job based on:
      # - Actionable Copilot review comments (CHANGES_REQUESTED with inline comments)
      # - Failing required CI checks
      # - Deduplication guard (max 3 dispatches per SHA)
      # - Privileged path / Docker / fork / label guards
      # SECURITY INVARIANT: This step NEVER approves or merges — it only decides
      # whether to dispatch the repair job.
      - name: Dispatch decision
        id: dispatch-decision
        if: >
          steps.pr-meta.outputs.should_proceed == 'true' &&
          steps.guards.outputs.should_proceed == 'true' &&
          steps.apply-patch.outputs.pushed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-meta.outputs.pr_number }}', 10);
            const headSha = '${{ steps.pr-meta.outputs.head_sha }}';
            const hasComments = '${{ steps.check-review.outputs.has_comments }}' === 'true';
            const hasFailedChecks = '${{ steps.guards.outputs.has_failed_checks }}' === 'true';
            const reviewUrl = '${{ steps.check-review.outputs.review_url }}' || '';

            // Default outputs
            core.setOutput('repair_needed', 'false');
            core.setOutput('repair_type', '');
            core.setOutput('review_url', reviewUrl);
            core.setOutput('repair_comment_id', '');

            // ── Guard: Dispatch pre-check for action_required lint runs (FR-009) ──
            // When triggered by workflow_run, check the triggering lint run's conclusion.
            // If the lint run is in action_required state (pending workflow approval), skip
            // dispatch — the workflow-approval-monitor will handle approval separately.
            if (context.eventName === 'workflow_run') {
              const triggeringRun = context.payload.workflow_run;
              if (triggeringRun.conclusion === 'action_required') {
                core.info(`Triggering lint run ${triggeringRun.id} has conclusion action_required — ` +
                          `skipping dispatch (workflow approval pending).`);
                return;
              }
              if (triggeringRun.conclusion === null) {
                core.info(`Triggering lint run ${triggeringRun.id} has no conclusion — skipping dispatch.`);
                return;
              }
            }

            // Only dispatch when there's something to fix
            if (!hasComments && !hasFailedChecks) {
              core.info('No actionable comments or failed checks — no repair needed.');
              return;
            }

            // Fetch all PR comments for the upsert helper and the deduplication guard.
            // Placed after the early-exit to avoid unnecessary API calls when no repair is needed.
            const allComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            // Helper: upsert a single updatable marker comment for this SHA.
            // Used by privileged-path guard, Docker guard, and the main dispatch path
            // to avoid duplicating the list→find→update/create pattern.
            async function upsertRepairMarker(body) {
              const existing = allComments.find(
                c => c.body && c.body.includes(`<!-- repair-dispatch:${headSha}:`)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                return existing.id;
              } else {
                const { data: created } = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body,
                });
                return created.id;
              }
            }

            // ── Guard: privileged paths (FR-010) ──
            const PRIVILEGED_PATH_PREFIXES = ['.github/workflows/', '.github/actions/', '.github/scripts/'];
            const prFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const touchesPrivileged = prFiles.some(
              f => PRIVILEGED_PATH_PREFIXES.some(prefix => f.filename.startsWith(prefix)) &&
                   !f.filename.endsWith('.md')
            );
            if (touchesPrivileged) {
              core.notice('PR modifies privileged automation paths — skipping repair dispatch (requires human review).');
              const guardRunUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const guardBody = [
                `<!-- repair-dispatch:${headSha}:0 -->`,
                `🔧 **AI PR Loop Repair** (SHA: \`${headSha.slice(0,7)}\`)`,
                `**Status**: ⚠️ human intervention required (privileged paths modified)`,
                `**Type**: ${hasComments && hasFailedChecks ? 'both' : hasComments ? 'review' : 'ci'}`,
                `**Trigger**: ${context.eventName}`,
                reviewUrl ? `**Review**: ${reviewUrl}` : null,
                `**Run**: [${context.runId}](${guardRunUrl})`,
              ].filter(Boolean).join('\n');
              await upsertRepairMarker(guardBody);
              return;
            }

            // ── Guard: Docker / privileged-file detection (SEC-008) ──
            const dockerFiles = ['Dockerfile', 'docker-compose.yml', 'docker-compose.yaml'];
            const touchesDocker = prFiles.some(
              f => dockerFiles.some(df => f.filename === df || f.filename.endsWith('/' + df))
            );
            if (touchesDocker) {
              core.notice('PR modifies Docker files — skipping repair dispatch (requires human review).');
              const dockerRunUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const guardBody = [
                `<!-- repair-dispatch:${headSha}:0 -->`,
                `🔧 **AI PR Loop Repair** (SHA: \`${headSha.slice(0,7)}\`)`,
                `**Status**: ⚠️ human intervention required (Docker files modified)`,
                `**Type**: ${hasComments && hasFailedChecks ? 'both' : hasComments ? 'review' : 'ci'}`,
                `**Trigger**: ${context.eventName}`,
                reviewUrl ? `**Review**: ${reviewUrl}` : null,
                `**Run**: [${context.runId}](${dockerRunUrl})`,
              ].filter(Boolean).join('\n');
              await upsertRepairMarker(guardBody);
              return;
            }

            // ── Deduplication guard (FR-007) ──
            const MAX_DISPATCHES_PER_SHA = 3;
            const markerPrefix = `<!-- repair-dispatch:${headSha}:`;

            const markerComment = allComments.find(
              c => c.body && c.body.includes(markerPrefix)
            );

            let dispatchCount = 0;
            let commentId = null;

            if (markerComment) {
              commentId = markerComment.id;
              const countMatch = markerComment.body.match(/<!-- repair-dispatch:[a-f0-9]+:(\d+) -->/);
              dispatchCount = countMatch ? parseInt(countMatch[1], 10) : 0;

              if (dispatchCount >= MAX_DISPATCHES_PER_SHA) {
                core.warning(`Dedup guard: ${dispatchCount} dispatches already for SHA ${headSha.slice(0,7)} — human intervention required.`);
                const dedupRunUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: commentId,
                  body: [
                    `<!-- repair-dispatch:${headSha}:${dispatchCount} -->`,
                    `🔧 **AI PR Loop Repair** (SHA: \`${headSha.slice(0,7)}\`, dispatch ${dispatchCount}/${MAX_DISPATCHES_PER_SHA})`,
                    `**Status**: ⚠️ human intervention required (dispatch limit reached)`,
                    `**Type**: ${hasComments && hasFailedChecks ? 'both' : hasComments ? 'review' : 'ci'}`,
                    `**Trigger**: ${context.eventName}`,
                    reviewUrl ? `**Review**: ${reviewUrl}` : null,
                    `**Run**: [${context.runId}](${dedupRunUrl})`,
                  ].filter(Boolean).join('\n'),
                });
                return;
              }
            }

            // ── Determine repair type ──
            let repairType = 'review';
            if (hasComments && hasFailedChecks) {
              repairType = 'both';
            } else if (hasFailedChecks) {
              repairType = 'ci';
            }

            // ── Create or update marker comment ──
            const newCount = dispatchCount + 1;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commentBody = [
              `<!-- repair-dispatch:${headSha}:${newCount} -->`,
              `🔧 **AI PR Loop Repair** (SHA: \`${headSha.slice(0,7)}\`, dispatch ${newCount}/${MAX_DISPATCHES_PER_SHA})`,
              `**Status**: pending`,
              `**Type**: ${repairType}`,
              `**Trigger**: ${context.eventName}`,
              reviewUrl ? `**Review**: ${reviewUrl}` : null,
              `**Run**: [${context.runId}](${runUrl})`,
            ].filter(Boolean).join('\n');

            commentId = await upsertRepairMarker(commentBody);
            core.info(`Upserted repair marker comment (dispatch ${newCount}/${MAX_DISPATCHES_PER_SHA}).`);

            // ── Set outputs ──
            core.setOutput('repair_needed', 'true');
            core.setOutput('repair_type', repairType);
            core.setOutput('review_url', reviewUrl);
            core.setOutput('repair_comment_id', String(commentId));
            core.notice(`Dispatching agentic repair: type=${repairType}, SHA=${headSha.slice(0,7)}, dispatch=${newCount}/${MAX_DISPATCHES_PER_SHA}`);

      # ─── Step 3: Approve & Merge ───────────────────────────────────────────
      - name: Check if ready to merge
        id: merge-check
        if: >
          steps.pr-meta.outputs.should_proceed == 'true' &&
          steps.guards.outputs.should_proceed == 'true' &&
          steps.guards.outputs.has_failed_checks != 'true' &&
          steps.guards.outputs.has_copilot_review == 'true' &&
          steps.check-review.outputs.has_comments != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-meta.outputs.pr_number }}', 10);
            let doNotMerge = '${{ steps.pr-meta.outputs.do_not_merge }}' === 'true';

            // SECURITY: Block auto-merge for PRs that modify privileged automation paths.
            // These paths control CI/CD permissions and must require human review.
            const PRIVILEGED_PATH_PREFIXES = ['.github/workflows/', '.github/actions/', '.github/scripts/'];
            const prFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const touchesPrivileged = prFiles.some(
              f => PRIVILEGED_PATH_PREFIXES.some(prefix => f.filename.startsWith(prefix)) &&
                   !f.filename.endsWith('.md')
            );
            if (touchesPrivileged) {
              core.info('PR modifies privileged automation paths — blocking auto-merge and auto-approval (requires human review).');
              doNotMerge = true;
              core.setOutput('touches_privileged', 'true');
            }

            // Final check: verify all checks are passing
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const headSha = pr.head.sha;

            // Guard: block merge if Copilot review state is CHANGES_REQUESTED
            const copilotLogin = 'copilot-pull-request-reviewer[bot]';
            const TRUSTED_SYNTHETIC_USERS = ['acmarsnik'];
            const SYNTHETIC_MARKER = '<!-- synthetic-copilot-review -->';
            const allReviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const copilotReviewsOnHead = allReviews.filter(
              r => r.commit_id === headSha && r.user && (
                r.user.login === copilotLogin ||
                (TRUSTED_SYNTHETIC_USERS.includes(r.user.login) && (r.body || '').includes(SYNTHETIC_MARKER))
              )
            );
            // Sort by submitted_at descending so the first element is the most recent
            copilotReviewsOnHead.sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));
            const latestCopilotReview = copilotReviewsOnHead[0];
            if (latestCopilotReview && latestCopilotReview.state === 'CHANGES_REQUESTED') {
              core.info('Copilot review is CHANGES_REQUESTED — cannot merge.');
              core.setOutput('ready', 'false');
              return;
            }
            // Synthetic reviews with 0 inline comments are treated as APPROVED equivalent
            const isSyntheticReview = latestCopilotReview &&
              TRUSTED_SYNTHETIC_USERS.includes(latestCopilotReview.user?.login) &&
              (latestCopilotReview.body || '').includes(SYNTHETIC_MARKER);
            if (isSyntheticReview) {
              const syntheticBody = latestCopilotReview.body || '';

              // Check machine-readable metadata for parse failures or failed inline posts
              const parseFailed = /parse_failed=true/.test(syntheticBody);
              if (parseFailed) {
                core.info('Synthetic Copilot review has parse_failed=true — cannot merge.');
                core.setOutput('ready', 'false');
                return;
              }

              // Check if intended comments > 0 but inline_posted == 0 (inline posting failed)
              const intendedMatch = syntheticBody.match(/intended_comments=(\d+)/);
              const inlinePostedMatch = syntheticBody.match(/inline_posted=(\d+)/);
              const intendedComments = intendedMatch ? parseInt(intendedMatch[1], 10) : null;
              const inlinePosted = inlinePostedMatch ? parseInt(inlinePostedMatch[1], 10) : null;

              // Fail closed when metadata is missing — synthetic review format may have
              // drifted or was manually crafted without proper markers.
              if (intendedComments === null || inlinePosted === null) {
                core.info('Synthetic Copilot review is missing machine-readable metadata — cannot merge (failing closed).');
                core.setOutput('ready', 'false');
                return;
              }

              if (intendedComments > 0 && inlinePosted === 0) {
                core.info(`Synthetic Copilot review intended ${intendedComments} comments but posted 0 inline — cannot merge until addressed.`);
                core.setOutput('ready', 'false');
                return;
              }

              // Check if the synthetic review has inline comments via API
              const syntheticComments = await github.paginate(
                github.rest.pulls.listCommentsForReview,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  review_id: latestCopilotReview.id,
                  per_page: 100,
                }
              );

              // Fail closed on mismatch: metadata says comments were posted but API returns 0
              // (could indicate deleted comments or incomplete API listing).
              if (inlinePosted > 0 && syntheticComments.length === 0) {
                core.info(`Synthetic review reports inline_posted=${inlinePosted} but API returned 0 comments — cannot merge (failing closed).`);
                core.setOutput('ready', 'false');
                return;
              }

              if (syntheticComments.length > 0) {
                core.info('Synthetic Copilot review has inline comments — cannot merge until addressed.');
                core.setOutput('ready', 'false');
                return;
              }
              core.info('Synthetic Copilot review with 0 inline comments — treating as APPROVED equivalent.');
            } else if (!latestCopilotReview || latestCopilotReview.state !== 'APPROVED') {
              core.info(`Copilot review state is "${latestCopilotReview?.state || 'none'}" (not APPROVED) — cannot merge.`);
              core.setOutput('ready', 'false');
              return;
            }

            const allCheckRuns = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                per_page: 100,
              },
              (response) => response.data.check_runs
            );

            const ciChecks = allCheckRuns.filter(
              cr => cr && cr.name !== 'AI PR Loop' && cr.name !== 'Generate lint fix patch'
            );
            const failedChecks = ciChecks.filter(
              cr => cr.status === 'completed' &&
                    cr.conclusion !== 'success' &&
                    cr.conclusion !== 'skipped' &&
                    cr.conclusion !== 'neutral'
            );

            if (failedChecks.length > 0) {
              const names = failedChecks.map(c => `${c.name} (${c.conclusion})`).join(', ');
              core.info(`Checks not passing: ${names} — cannot merge yet.`);
              core.setOutput('ready', 'false');
              return;
            }

            const pendingChecks = ciChecks.filter(cr => cr.status !== 'completed');
            if (pendingChecks.length > 0) {
              const names = pendingChecks.map(c => c.name).join(', ');
              core.info(`Checks still pending: ${names} — cannot merge yet.`);
              core.setOutput('ready', 'false');
              return;
            }

            core.setOutput('ready', 'true');
            core.setOutput('do_not_merge', doNotMerge ? 'true' : 'false');

      - name: Approve PR
        id: approve
        if: >
          steps.merge-check.outputs.ready == 'true' &&
          steps.merge-check.outputs.touches_privileged != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-meta.outputs.pr_number }}', 10);
            const headSha = '${{ steps.pr-meta.outputs.head_sha }}';

            // Verify head SHA hasn't changed since merge-check validated it
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.head.sha !== headSha) {
              core.warning(`PR head SHA changed (expected ${headSha.slice(0,7)}, got ${pr.head.sha.slice(0,7)}) — aborting approval.`);
              core.setOutput('approved', 'false');
              return;
            }

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                commit_id: headSha,
                event: 'APPROVE',
                body: '✅ All checks passing, no outstanding review comments. Approved by AI PR Loop.',
              });
              core.info(`Approved PR #${prNumber} at commit ${headSha.slice(0,7)}.`);
              core.setOutput('approved', 'true');
            } catch (error) {
              core.warning(`Failed to approve PR: ${error.message}`);
              core.setOutput('approved', 'false');
            }

      - name: Merge PR
        id: merge
        if: >
          steps.merge-check.outputs.ready == 'true' &&
          steps.merge-check.outputs.do_not_merge != 'true' &&
          steps.approve.outputs.approved == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-meta.outputs.pr_number }}', 10);
            const headSha = '${{ steps.pr-meta.outputs.head_sha }}';

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                sha: headSha,
                merge_method: 'squash',
              });
              core.info(`Merged PR #${prNumber} via squash.`);
            } catch (error) {
              // Retry once after a short delay
              core.warning(`First merge attempt failed: ${error.message}. Retrying in 10s...`);
              await new Promise(resolve => setTimeout(resolve, 10000));

              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  sha: headSha,
                  merge_method: 'squash',
                });
                core.info(`Merged PR #${prNumber} on retry.`);
              } catch (retryError) {
                core.setFailed(`Failed to merge PR #${prNumber}: ${retryError.message}`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: [
                    '<!-- ai-pr-loop-merge-failed -->',
                    '## ❌ AI PR Loop: Merge Failed',
                    '',
                    `Could not merge PR after retry.`,
                    `**Error**: ${retryError.message}`,
                    '',
                    `**Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                  ].join('\n'),
                });
              }
            }

      - name: Comment when do-not-auto-merge blocks merge
        if: >
          steps.merge-check.outputs.ready == 'true' &&
          steps.merge-check.outputs.do_not_merge == 'true' &&
          steps.approve.outputs.approved == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-meta.outputs.pr_number }}', 10);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                '<!-- ai-pr-loop-ready-no-merge -->',
                '## ✅ AI PR Loop: Ready for Manual Merge',
                '',
                'All checks are passing and the PR has been approved.',
                'The `do-not-auto-merge` label is present, so automatic merge is skipped.',
                '',
                'A human can now merge this PR when ready.',
              ].join('\n'),
            });

      # ─── Step 4: Re-request stale reviews ──────────────────────────────────
      - name: Re-request stale Copilot review
        if: >
          steps.pr-meta.outputs.should_proceed == 'true' &&
          steps.guards.outputs.should_proceed == 'true' &&
          steps.guards.outputs.has_copilot_review != 'true' &&
          steps.apply-patch.outputs.pushed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-meta.outputs.pr_number }}', 10);
            const headSha = '${{ steps.pr-meta.outputs.head_sha }}';
            const copilotLogin = 'copilot-pull-request-reviewer[bot]';
            // The requestReviewers API uses 'Copilot' (virtual user), not the bot login.
            const copilotReviewer = 'Copilot';

            // Get timeline events to find when review was last requested.
            // The timeline API requires a preview Accept header and may fail;
            // handle gracefully by falling back to requesting a fresh review.
            let reviewRequests = [];
            try {
              const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
                headers: { accept: 'application/vnd.github.mockingbird-preview+json' },
              });

              reviewRequests = events.filter(
                e => e.event === 'review_requested' &&
                     e.requested_reviewer &&
                     (e.requested_reviewer.login === copilotLogin ||
                      e.requested_reviewer.login === copilotReviewer)
              );
            } catch (timelineError) {
              core.warning(`Timeline API failed (${timelineError.message}) — requesting fresh review.`);
            }

            if (reviewRequests.length === 0) {
              core.info('No Copilot review request found — requesting one now.');
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  reviewers: [copilotReviewer],
                });
                core.info('Copilot review requested.');
              } catch (error) {
                core.warning(`Failed to request Copilot review: ${error.message}`);
              }
              return;
            }

            const lastRequest = reviewRequests[reviewRequests.length - 1];
            const requestedAt = new Date(lastRequest.created_at);
            const thirtyMinutesAgo = new Date(Date.now() - 30 * 60 * 1000);

            if (requestedAt < thirtyMinutesAgo) {
              core.info('Copilot review request is stale (>30 min) — re-requesting.');
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  reviewers: [copilotReviewer],
                });
                core.info('Copilot review re-requested.');
              } catch (error) {
                core.warning(`Failed to re-request Copilot review: ${error.message}`);
              }
            }

      # ─── Record cycle ──────────────────────────────────────────────────────
      # Record a cycle for every meaningful run that passes guards. Uses a single
      # updatable comment (identified by a hidden marker) to avoid flooding the PR
      # with bot comments and notifications. The comment body contains cycle count
      # and recent run history for auditability.
      - name: Record cycle
        if: >
          steps.pr-meta.outputs.should_proceed == 'true' &&
          steps.guards.outputs.should_proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-meta.outputs.pr_number }}', 10);
            const cycleCount = parseInt('${{ steps.guards.outputs.cycle_count }}', 10) + 1;
            const marker = '<!-- ai-pr-loop-cycle-tracker -->';

            // Find existing tracker comment
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const trackerComment = comments.find(c => c.body && c.body.includes(marker));

            const body = [
              marker,
              `<!-- cycle-count: ${cycleCount} -->`,
              `**AI PR Loop**: Cycle **${cycleCount}**/50 — [run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            if (trackerComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: trackerComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ═══════════════════════════════════════════════════════════════════════════
  # Job: agentic-repair
  # Performs automated code repair when the ai-pr-loop job detects actionable
  # Copilot review comments or CI failures. Runs a Copilot CLI session on a
  # GitHub-hosted runner to address the issues, push fixes, and re-request review.
  #
  # SECURITY DESIGN: This job is intended exclusively for code repair.
  # Approve/merge operations are restricted via prompt-based policy:
  # the system prompt instructs the Copilot session to only perform code
  # edits, lint fixes, and comment replies — never approve or merge.
  # Additionally, the job's GitHub token permissions (contents:write,
  # pull-requests:write) do NOT include admin/bypass privileges. Merges
  # require all branch-protection rules (required reviews, status checks)
  # to be satisfied first, which the repair job cannot fulfil on its own.
  # NOTE: There is no hard application-layer guard in agdt-* commands
  # today; this is defense-in-depth via prompt policy + branch protection.
  # Intended scope:
  #   - Code changes (edit, lint-fix, commit, push)
  #   - Comment replies and thread resolution
  #   - Re-requesting Copilot review
  # ═══════════════════════════════════════════════════════════════════════════
  agentic-repair:
    name: Agentic Repair
    needs: ai-pr-loop
    if: needs.ai-pr-loop.outputs.repair_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      actions: read

    steps:
      # ─── Step 0: PAT masking and validation (SEC-004, NFR-003, NFR-006) ───
      - name: Mask and validate PAT
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "::error::COPILOT_GITHUB_TOKEN secret is not set. The agentic-repair job requires a PAT with Contents R/W, Pull requests R/W, Issues R/W, Checks Read, and Actions Read permissions."
            exit 1
          fi
          echo "::add-mask::${COPILOT_GITHUB_TOKEN}"
          echo "PAT validated and masked."

      # ─── Step 1: Checkout trusted main branch (FR-005, SEC-003) ───────────
      # Agent prompts and instructions are sourced from this trusted checkout,
      # not the PR branch.
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: __trusted_main

      # ─── Step 2: Set up Python 3.12 ─────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ─── Step 3: Install agentic-devtools from PyPI (FR-005) ─────────────
      - name: Install agentic-devtools
        run: |
          set -euo pipefail
          pip install "agentic-devtools==${{ env.AGDT_VERSION }}"
          echo "Installed agentic-devtools ${{ env.AGDT_VERSION }} from PyPI."

      # ─── Step 4: Install trusted tooling (SEC-003) ──────────────────────
      - name: Install ruff and markdownlint
        run: |
          set -euo pipefail
          pip install ruff==0.11.12
          npm install -g markdownlint-cli2@0.17.2
          echo "Installed ruff 0.11.12 and markdownlint-cli2 0.17.2."

      # ─── Step 5: Install Copilot CLI (FR-005) ───────────────────────────
      - name: Install Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Install standalone copilot binary via agdt helper
          agdt-setup-copilot-cli --no-persist-env || true
          # Fallback: install gh copilot extension
          gh extension install github/gh-copilot 2>/dev/null || true
          # Validate at least one is available
          if command -v copilot &>/dev/null; then
            echo "Standalone copilot binary available."
          elif gh copilot --help &>/dev/null 2>&1; then
            echo "::warning::Only gh copilot extension is available (not standalone binary). The gh copilot extension uses 'suggest' mode which cannot autonomously apply edits in non-interactive CI. Repair effectiveness may be limited."
            echo "gh copilot extension available (degraded mode)."
          else
            echo "::error::Neither standalone copilot binary nor gh copilot extension could be installed. The agentic-repair job cannot proceed without a Copilot CLI."
            exit 1
          fi

      # ─── Step 6: Fetch PR branch as data-only worktree (SEC-003) ────────
      # SECURITY: Uses explicit git commands instead of actions/checkout for
      # the untrusted PR branch. This provides three concrete security benefits
      # over the opaque actions/checkout composite action:
      #   1. Every command is visible and auditable — no hidden credential
      #      helpers, submodule processing, or LFS hooks that could interact
      #      with untrusted repo config.
      #   2. Fetch credentials are one-shot (git -c extraheader), never persisted
      #      in .git/config. Push credentials (Step 7) are supplied via
      #      GIT_ASKPASS at runtime — never stored in .git/config — and
      #      contained to the ephemeral runner, destroyed when the job ends.
      #   3. SHA verification (TOCTOU guard) detects if the PR head changed
      #      between dispatch and fetch.
      # The PR code is fetched AFTER all trusted tool installations (Steps 2-5)
      # and is used strictly for editing — never executed as build scripts,
      # tests, or package definitions.
      - name: Fetch PR branch (data-only)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.ai-pr-loop.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.ai-pr-loop.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir pr-worktree && cd pr-worktree
          git init
          git remote add origin "https://github.com/${{ github.repository }}.git"
          # Fetch PR head ref using default workflow token (not persisted)
          AUTH="Authorization: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=${AUTH}" \
            fetch --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          git checkout "refs/remotes/origin/pr-head"
          # Verify checked-out SHA matches expected (TOCTOU guard)
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::PR head SHA changed during fetch (expected ${EXPECTED_SHA:0:7}, got ${ACTUAL_SHA:0:7}). Aborting to avoid conflicts."
            exit 1
          fi

      # ─── Step 7: Configure git credentials and restore branch ────────────
      - name: Configure git credentials
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ needs.ai-pr-loop.outputs.head_branch }}
        run: |
          set -euo pipefail
          cd pr-worktree
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Use tokenless remote URL + GIT_ASKPASS for one-shot auth.
          # This avoids persisting the PAT in .git/config where it could leak
          # via debug output, error messages, or tooling that prints remotes.
          git remote set-url origin "https://x-access-token@github.com/${{ github.repository }}.git"
          printf '#!/bin/sh\nprintf "%%s" "${COPILOT_GITHUB_TOKEN}"\n' > /tmp/git-askpass.sh
          chmod +x /tmp/git-askpass.sh
          # Switch from detached HEAD to the actual PR branch
          # Guard against option injection if branch name starts with '-'
          if [[ "${HEAD_BRANCH}" == -* ]]; then
            echo "::error::Branch name '${HEAD_BRANCH}' starts with '-' — refusing to proceed (potential option injection)."
            exit 1
          fi
          git checkout -B "${HEAD_BRANCH}" HEAD

      # ─── Step 8: PR state validation ────────────────────────────────────
      - name: Validate PR state
        id: validate-pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.ai-pr-loop.outputs.pr_number }}', 10);
            const expectedSha = '${{ needs.ai-pr-loop.outputs.head_sha }}';

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Check if PR is still open
            if (pr.state !== 'open') {
              core.info(`PR #${prNumber} is ${pr.state} — exiting cleanly.`);
              core.setOutput('should_proceed', 'false');
              return;
            }

            // Check if head SHA still matches (another push may have occurred)
            if (pr.head.sha !== expectedSha) {
              core.info(`PR head SHA changed (expected ${expectedSha.slice(0,7)}, got ${pr.head.sha.slice(0,7)}) — exiting to avoid conflicts.`);
              core.setOutput('should_proceed', 'false');
              return;
            }

            // Check for merge conflicts (poll briefly if mergeable is null)
            let mergeable = pr.mergeable;
            if (mergeable === null) {
              // GitHub is still computing mergeability — retry up to 5 times
              for (let attempt = 0; attempt < 5 && mergeable === null; attempt++) {
                await new Promise(r => setTimeout(r, 2000));
                const { data: freshPr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                });
                mergeable = freshPr.mergeable;
              }
            }
            if (mergeable === false) {
              core.warning(`PR #${prNumber} has merge conflicts — skipping repair.`);
              core.setOutput('should_proceed', 'false');
              return;
            }
            if (mergeable === null) {
              core.warning(`PR #${prNumber} mergeability is still unknown after retries — skipping repair to avoid conflicts.`);
              core.setOutput('should_proceed', 'false');
              return;
            }

            core.setOutput('should_proceed', 'true');

      # ─── Step 9: Update repair comment to "started" (FR-008) ───────────
      - name: Update repair comment (started)
        if: steps.validate-pr.outputs.should_proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const commentId = parseInt('${{ needs.ai-pr-loop.outputs.repair_comment_id }}', 10);
            if (!commentId) {
              core.info('No repair comment ID — skipping status update.');
              return;
            }

            const headSha = '${{ needs.ai-pr-loop.outputs.head_sha }}';
            const repairType = '${{ needs.ai-pr-loop.outputs.repair_type }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Read existing comment to preserve dispatch count and metadata
            const { data: existing } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
            });
            const countMatch = (existing.body || '').match(/<!-- repair-dispatch:[a-f0-9]+:(\d+) -->/);
            const count = countMatch ? countMatch[1] : '1';
            // Preserve Trigger and Review fields from the original dispatch comment
            const triggerMatch = (existing.body || '').match(/\*\*Trigger\*\*: (.+)/);
            const reviewMatch = (existing.body || '').match(/\*\*Review\*\*: (.+)/);

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: [
                `<!-- repair-dispatch:${headSha}:${count} -->`,
                `🔧 **AI PR Loop Repair** (SHA: \`${headSha.slice(0,7)}\`, dispatch ${count}/3)`,
                `**Status**: 🔄 started`,
                `**Type**: ${repairType}`,
                triggerMatch ? `**Trigger**: ${triggerMatch[1]}` : null,
                reviewMatch ? `**Review**: ${reviewMatch[1]}` : null,
                `**Run**: [${context.runId}](${runUrl})`,
              ].filter(Boolean).join('\n'),
            });

      # ─── Step 10: Retrieve CI failure context (FR-002) ────────────────────
      - name: Retrieve CI failure context
        id: ci-logs
        if: >
          steps.validate-pr.outputs.should_proceed == 'true' &&
          (needs.ai-pr-loop.outputs.repair_type == 'ci' || needs.ai-pr-loop.outputs.repair_type == 'both')
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_SHA="${{ needs.ai-pr-loop.outputs.head_sha }}"
          REPO="${{ github.repository }}"

          # List check runs for the head SHA, filter to failed ones
          API_STDERR=$(mktemp)
          FAILED_CHECK_NAMES=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
            --paginate \
            --jq '.check_runs[] | select(.status == "completed" and .conclusion == "failure" and .name != "AI PR Loop" and .name != "Generate lint fix patch") | .name' \
            2>"$API_STDERR") || {
            echo "::error::Failed to retrieve check runs from GitHub API. Stderr:"
            cat "$API_STDERR" >&2
            rm -f "$API_STDERR"
            exit 1
          }
          rm -f "$API_STDERR"

          if [ -z "$FAILED_CHECK_NAMES" ]; then
            echo "No failed checks found."
            echo "ci_context_file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build name→id map from a single API call (avoids re-querying per check)
          CHECK_RUNS_STDERR=$(mktemp)
          CHECK_RUNS_JSON=$(gh api --paginate "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
            --jq '.check_runs[] | {name: .name, id: .id}' 2>"$CHECK_RUNS_STDERR") || {
            echo "::error::Failed to fetch check-run details for name→id mapping. Cannot proceed without CI context. Stderr:"
            cat "$CHECK_RUNS_STDERR" >&2
            rm -f "$CHECK_RUNS_STDERR"
            echo "ci_context_file=" >> "$GITHUB_OUTPUT"
            exit 1
          }
          rm -f "$CHECK_RUNS_STDERR"

          # Build CI context file directly (avoids subshell variable scoping issues)
          CI_CONTEXT_FILE="/tmp/ci-failure-context.md"
          echo "## CI Failure Context" > "$CI_CONTEXT_FILE"
          echo "" >> "$CI_CONTEXT_FILE"

          # Process each failed check
          echo "$FAILED_CHECK_NAMES" | while IFS= read -r CHECK_NAME; do
            [ -z "$CHECK_NAME" ] && continue
            echo "Fetching logs for failed check: ${CHECK_NAME}"

            # Look up the check run ID from the pre-fetched map
            # Slurp the newline-delimited JSON stream into a single array, then
            # select + first to guarantee exactly one ID (or empty) even when
            # duplicate check names exist (e.g., matrix jobs).
            CHECK_RUN_ID=$(echo "$CHECK_RUNS_JSON" | jq -rs --arg name "$CHECK_NAME" '[.[] | select(.name == $name)] | first | .id // empty')

            if [ -z "$CHECK_RUN_ID" ] || [ "$CHECK_RUN_ID" = "null" ]; then
              echo "::warning::Could not find check-run ID for '${CHECK_NAME}' — skipping annotations."
              echo "### ${CHECK_NAME}" >> "$CI_CONTEXT_FILE"
              echo "" >> "$CI_CONTEXT_FILE"
              echo "(Could not resolve check-run ID)" >> "$CI_CONTEXT_FILE"
              echo "" >> "$CI_CONTEXT_FILE"
              continue
            fi

            # Get annotations for the check run (most useful for lint errors)
            # Request exactly 50 annotations in a single page to enforce a global
            # cap. Using --paginate with per-page jq slicing would apply the limit
            # per page, potentially exceeding the intended 50-annotation cap.
            ANNOTATIONS_STDERR=$(mktemp)
            ANNOTATIONS=$(gh api "repos/${REPO}/check-runs/${CHECK_RUN_ID}/annotations?per_page=50" \
              --jq '[.[] | "- \(.path):\(.start_line): \(.message)"] | .[]' \
              2>"$ANNOTATIONS_STDERR") || {
              echo "::warning::Failed to retrieve annotations for '${CHECK_NAME}' (check-run ${CHECK_RUN_ID}). Stderr:"
              cat "$ANNOTATIONS_STDERR" >&2
              ANNOTATIONS=""
            }
            rm -f "$ANNOTATIONS_STDERR"

            echo "### ${CHECK_NAME}" >> "$CI_CONTEXT_FILE"
            echo "" >> "$CI_CONTEXT_FILE"
            if [ -n "$ANNOTATIONS" ]; then
              echo '```' >> "$CI_CONTEXT_FILE"
              echo "$ANNOTATIONS" >> "$CI_CONTEXT_FILE"
              echo '```' >> "$CI_CONTEXT_FILE"
            else
              echo "(No annotations available — check the workflow run for details)" >> "$CI_CONTEXT_FILE"
            fi
            echo "" >> "$CI_CONTEXT_FILE"
          done

          echo "ci_context_file=${CI_CONTEXT_FILE}" >> "$GITHUB_OUTPUT"

      # ─── Step 11: Render prompt ─────────────────────────────────────────
      - name: Render repair prompt
        id: render-prompt
        if: steps.validate-pr.outputs.should_proceed == 'true'
        env:
          REPAIR_TYPE: ${{ needs.ai-pr-loop.outputs.repair_type }}
          REVIEW_URL: ${{ needs.ai-pr-loop.outputs.review_url }}
          PR_NUMBER: ${{ needs.ai-pr-loop.outputs.pr_number }}
          HEAD_SHA: ${{ needs.ai-pr-loop.outputs.head_sha }}
        run: |
          set -euo pipefail

          # Read CI-safe prompt from trusted main checkout
          PROMPT_FILE="__trusted_main/.github/prompts/agdt.address-copilot-review.ci-repair.prompt.md"
          if [ ! -f "$PROMPT_FILE" ]; then
            echo "::error::CI-safe prompt file not found at ${PROMPT_FILE}"
            exit 1
          fi

          cp "$PROMPT_FILE" /tmp/repair-prompt.md

          # Inject review URL if available
          if [ -n "${REVIEW_URL}" ]; then
            printf '\n---\n\n## Review URL\n\n%s\n' "${REVIEW_URL}" >> /tmp/repair-prompt.md
          fi

          # Inject CI failure context if available
          if [ -f "/tmp/ci-failure-context.md" ]; then
            printf '\n---\n\n' >> /tmp/repair-prompt.md
            cat /tmp/ci-failure-context.md >> /tmp/repair-prompt.md
          fi

          # Add environment context
          printf '\n---\n\n## Environment Context\n\n' >> /tmp/repair-prompt.md
          printf '- **PR Number**: %s\n' "${PR_NUMBER}" >> /tmp/repair-prompt.md
          printf '- **Head SHA**: %s\n' "${HEAD_SHA}" >> /tmp/repair-prompt.md
          printf '- **Repository**: %s\n' "${{ github.repository }}" >> /tmp/repair-prompt.md
          printf '- **Repair Type**: %s\n' "${REPAIR_TYPE}" >> /tmp/repair-prompt.md

          echo "Rendered repair prompt to /tmp/repair-prompt.md"

      # ─── Step 12: Run Copilot session ───────────────────────────────────
      - name: Run Copilot repair session
        id: copilot-session
        if: steps.validate-pr.outputs.should_proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GIT_ASKPASS: /tmp/git-askpass.sh
          AGDT_CI_REPAIR_MODE: '1'
          REPAIR_PR_NUMBER: ${{ needs.ai-pr-loop.outputs.pr_number }}
          REPAIR_REVIEW_URL: ${{ needs.ai-pr-loop.outputs.review_url }}
          REPAIR_HEAD_SHA: ${{ needs.ai-pr-loop.outputs.head_sha }}
        run: |
          set -euo pipefail
          cd pr-worktree

          # Try Python session launcher first; capture exit code explicitly
          PYTHON_EXIT=0
          python3 - <<'PY' || PYTHON_EXIT=$?
          import pathlib, sys
          try:
              from agentic_devtools.cli.copilot.session import start_copilot_session
              result = start_copilot_session(
                  prompt=pathlib.Path('/tmp/repair-prompt.md').read_text(),
                  working_directory='.',
                  interactive=False
              )
              if result.process is None:
                  print('ERROR: Copilot session did not start (no process handle)', file=sys.stderr)
                  sys.exit(1)
              result.process.wait()
              if result.process.returncode != 0:
                  sys.exit(result.process.returncode)
          except ImportError:
              print('agentic_devtools.cli.copilot.session not available — falling back to CLI', file=sys.stderr)
              sys.exit(2)
          except Exception as e:
              print(f'Session launcher error: {e}', file=sys.stderr)
              sys.exit(2)
          PY

          # Exit code 2 = ImportError or session launcher unavailable → try CLI fallback
          if [ "$PYTHON_EXIT" -eq 2 ]; then
            echo "Falling back to standalone copilot CLI..."
            if command -v copilot &>/dev/null; then
              copilot --allow-all -p "Read the prompt from /tmp/repair-prompt.md and follow the instructions."
            elif gh copilot suggest --help &>/dev/null 2>&1; then
              gh copilot suggest "Read the prompt from /tmp/repair-prompt.md and follow the instructions."
            else
              echo "::error::No Copilot CLI available — cannot run repair session."
              exit 1
            fi
          elif [ "$PYTHON_EXIT" -ne 0 ]; then
            echo "::error::Copilot session failed with exit code ${PYTHON_EXIT}."
            exit "$PYTHON_EXIT"
          fi

      # ─── Step 13: Re-request Copilot review (FR-009) ───────────────────
      - name: Re-request Copilot review
        if: steps.validate-pr.outputs.should_proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.ai-pr-loop.outputs.pr_number }}', 10);
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: ['Copilot'],
              });
              core.info(`Re-requested Copilot review for PR #${prNumber} after repair.`);
            } catch (error) {
              core.warning(`Failed to request Copilot review (best-effort): ${error.message}`);
            }

      # ─── Step 14: Update repair comment (completed/failed) (FR-008) ────
      - name: Update repair comment (completed)
        if: always() && needs.ai-pr-loop.outputs.repair_comment_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const commentId = parseInt('${{ needs.ai-pr-loop.outputs.repair_comment_id }}', 10);
            if (!commentId) return;

            const headSha = '${{ needs.ai-pr-loop.outputs.head_sha }}';
            const repairType = '${{ needs.ai-pr-loop.outputs.repair_type }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const jobStatus = '${{ job.status }}';
            const shouldProceed = '${{ steps.validate-pr.outputs.should_proceed }}';

            // Read existing comment to preserve dispatch count and metadata
            const { data: existing } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
            });
            const countMatch = (existing.body || '').match(/<!-- repair-dispatch:[a-f0-9]+:(\d+) -->/);
            const count = countMatch ? countMatch[1] : '1';
            // Preserve Trigger and Review fields from the original dispatch comment
            const triggerMatch = (existing.body || '').match(/\*\*Trigger\*\*: (.+)/);
            const reviewMatch = (existing.body || '').match(/\*\*Review\*\*: (.+)/);

            let status, icon;
            if (shouldProceed === 'true') {
              // Validation passed — use job status to determine outcome
              if (jobStatus === 'success') {
                status = 'completed';
                icon = '✅';
              } else if (jobStatus === 'cancelled') {
                status = 'timed out/cancelled — human intervention required';
                icon = '⚠️';
              } else {
                status = 'failed — human intervention required';
                icon = '❌';
              }
            } else if (shouldProceed === 'false') {
              // Validation explicitly blocked execution (PR closed, SHA changed, merge conflicts)
              status = 'skipped (validation blocked)';
              icon = '⏭️';
            } else {
              // shouldProceed is empty — validation step never ran (e.g., earlier step failed)
              if (jobStatus === 'cancelled') {
                status = 'timed out/cancelled — human intervention required';
                icon = '⚠️';
              } else {
                status = 'failed — human intervention required';
                icon = '❌';
              }
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: [
                `<!-- repair-dispatch:${headSha}:${count} -->`,
                `🔧 **AI PR Loop Repair** (SHA: \`${headSha.slice(0,7)}\`, dispatch ${count}/3)`,
                `**Status**: ${icon} ${status}`,
                `**Type**: ${repairType}`,
                triggerMatch ? `**Trigger**: ${triggerMatch[1]}` : null,
                reviewMatch ? `**Review**: ${reviewMatch[1]}` : null,
                `**Run**: [${context.runId}](${runUrl})`,
              ].filter(Boolean).join('\n'),
            });

