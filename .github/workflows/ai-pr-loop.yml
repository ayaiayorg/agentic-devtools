name: AI PR Loop

on:
  pull_request:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Python Tests and Linting", "Lint", "Workflow Integration Tests"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read
env:
  AGDT_USE_PYTHON_ORCHESTRATOR: "1"
concurrency:
  group: ai-pr-loop-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false
jobs:
  ai-pr-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'pull_request_review' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.review.user.login == 'Copilot' ||
         github.event.review.user.login == 'copilot-pull-request-reviewer[bot]')) ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.pull_requests[0].number != null))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.AGDT_PR_APPROVER_PAT }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agentic-devtools
        run: pip install agentic-devtools
      - name: Run AI PR loop orchestrator
        env:
          GH_TOKEN: ${{ secrets.AGDT_PR_APPROVER_PAT }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AGDT_PR_APPROVER_PAT: ${{ secrets.AGDT_PR_APPROVER_PAT }}
        run: agdt-ai-pr-loop
