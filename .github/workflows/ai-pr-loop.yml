name: AI PR Loop

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process (scheduler-driven)'
        required: true
        type: string
      trigger_reason:
        description: 'Reason for dispatch (e.g. scheduler_oldest_eligible)'
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
env:
  AGDT_USE_PYTHON_ORCHESTRATOR: "1"
  AGDT_USE_PIPELINE_V2: "1"
  ENABLE_AUTO_APPLY_SUGGESTIONS: ${{ vars.ENABLE_AUTO_APPLY_SUGGESTIONS || 'false' }}
concurrency:
  group: ai-pr-loop-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false
jobs:
  ai-pr-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.inputs.pr_number != ''
    steps:
      - name: Resolve PR head ref
        id: dispatch-pr
        env:
          GH_TOKEN: ${{ secrets.AGDT_PR_APPROVER_PAT }}
        run: |
          set -euo pipefail
          pr_number='${{ github.event.inputs.pr_number }}'
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::workflow_dispatch input pr_number must be a numeric pull request number"
            exit 1
          fi
          pr_json="$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json headRefName)"
          head_ref="$(echo "$pr_json" | jq -r '.headRefName')"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.dispatch-pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.AGDT_PR_APPROVER_PAT }}
      - name: Configure git identity
        run: |
          git config user.name "acmarsn-agdt"
          git config user.email "269151600+acmarsn-agdt@users.noreply.github.com"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agentic-devtools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "github-copilot-sdk>=0.1.0,<1.0.0"
          python -m pip install --force-reinstall --no-deps "github-copilot-sdk>=0.1.0,<1.0.0"
          python -c "from copilot import CopilotClient, SubprocessConfig; from copilot.session import PermissionHandler; print('✓ Copilot SDK imports OK')"
          python -m pip install agentic-devtools
      - name: Run AI PR loop orchestrator
        env:
          GH_TOKEN: ${{ secrets.AGDT_PR_APPROVER_PAT }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AGDT_PR_APPROVER_PAT: ${{ secrets.AGDT_PR_APPROVER_PAT }}
          AGDT_ALLOW_PRIVILEGED_PATHS: "1"
        run: agdt-ai-pr-loop
      - name: Dispatch AI PR Loop Redispatch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AGDT_PR_APPROVER_PAT }}
        run: |
          gh workflow run ai-pr-loop-redispatch.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}"
