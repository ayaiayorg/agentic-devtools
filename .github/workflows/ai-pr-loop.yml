name: AI PR Loop

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process (scheduler-driven)'
        required: true
        type: string
      trigger_reason:
        description: 'Reason for dispatch (e.g. scheduler_oldest_eligible)'
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
env:
  AGDT_USE_PYTHON_ORCHESTRATOR: "1"
  AGDT_USE_PIPELINE_V2: "1"
  ENABLE_AUTO_APPLY_SUGGESTIONS: ${{ vars.ENABLE_AUTO_APPLY_SUGGESTIONS || 'false' }}
concurrency:
  group: ai-pr-loop-${{ replace(replace(github.event.inputs.pr_number, '"', ''), '''', '') }}
  cancel-in-progress: false
jobs:
  ai-pr-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.inputs.pr_number != ''
    steps:
      - name: Resolve PR head ref
        id: dispatch-pr
        env:
          GH_TOKEN: ${{ secrets.AGDT_PR_APPROVER_PAT }}
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_number="$PR_NUMBER_INPUT"
          if [[ "$pr_number" =~ ^\"([0-9]+)\"$ || "$pr_number" =~ ^\'([0-9]+)\'$ ]]; then
            pr_number="${BASH_REMATCH[1]}"
          fi
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::workflow_dispatch input pr_number must be a numeric pull request number"
            exit 1
          fi
          pr_json="$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json headRefName)"
          head_ref="$(echo "$pr_json" | jq -r '.headRefName')"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.dispatch-pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.AGDT_PR_APPROVER_PAT }}
      - name: Configure git identity
        run: |
          git config user.name "acmarsn-agdt"
          git config user.email "269151600+acmarsn-agdt@users.noreply.github.com"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agentic-devtools
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run AI PR loop orchestrator
        env:
          GH_TOKEN: ${{ secrets.AGDT_PR_APPROVER_PAT }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AGDT_PR_APPROVER_PAT: ${{ secrets.AGDT_PR_APPROVER_PAT }}
          AGDT_ALLOW_PRIVILEGED_PATHS: "1"
        run: |
          exit_code=0
          set +e
          agdt-ai-pr-loop
          exit_code=$?
          set -e
          # Control-flow exits from ai-pr-loop:
          #   1 = guard-blocked
          #   5 = repair-dispatched
          if [[ "$exit_code" -eq 1 || "$exit_code" -eq 5 ]]; then
            echo "::notice::ai-pr-loop exited with control-flow code ${exit_code}; treating as non-fatal."
            exit 0
          fi
          exit "$exit_code"
      - name: Dispatch AI PR Loop Redispatch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AGDT_PR_APPROVER_PAT }}
        run: |
          gh workflow run ai-pr-loop-redispatch.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
          || echo "::warning::Failed to dispatch ai-pr-loop-redispatch.yml; continuing"
