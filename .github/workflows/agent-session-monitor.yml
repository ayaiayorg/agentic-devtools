# PR Scheduler — Oldest-Eligible PR Dispatch
#
# Triggered by workflow_dispatch only (no cron).  The continuous loop is
# driven by ai-pr-loop-redispatch.yml, which dispatches this workflow after
# each ai-pr-loop run.  pr-activity-dispatch cold-starts the loop whenever
# a PR is opened or updated.
#
# Selects exactly one PR to process:
#   1. Lists open PRs ordered by creation date ascending (oldest first).
#   2. Skips PRs with the `ai-pr-loop-ignore` exclusion label.
#   3. Skips fork PRs.
#   4. Skips human-blocked PRs (merge-ready but missing `ai-auto-merge-allowed`).
#   5. Dispatches `ai-pr-loop.yml` for the first AI-actionable PR found.
#   6. Exits cleanly if no eligible PR exists.
#
# Design:
#   - At most ONE PR is dispatched per invocation.
#   - The same oldest actionable PR is revisited each cycle until it is
#     merged, closed, or becomes human-blocked.
#   - Human-blocked = all required checks pass AND has approval AND lacks
#     `ai-auto-merge-allowed` label.
#
# Related:
#   - ai-pr-loop.yml — execution workflow (scheduler-driven only)
#   - ai-pr-loop-redispatch.yml — continuous loop driver (replaces cron)
#   - pr-activity-dispatch.yml — cold-start trigger on PR events

name: Agent Session Monitor

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  actions: write
  issues: write

jobs:
  monitor-agent-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: agent-session-monitor
      cancel-in-progress: false

    steps:
      - name: Scan and dispatch
        id: scan
        env:
          GH_TOKEN: ${{ secrets.AGDT_PR_APPROVER_PAT }}
          DRY_RUN: ${{ vars.AGENT_MONITOR_DRY_RUN || '' }}
        run: |
          set -uo pipefail

          # --- Initialization ---
          SCAN_BUDGET_SECONDS=330
          START_EPOCH=$(date +%s)
          DISPATCHES=0
          PRS_SCANNED=0
          SELECTED_PR=""
          BUDGET_EXHAUSTED="false"
          SKIP_REASONS=""

          LABEL_SKIP="ai-pr-loop-ignore"
          LABEL_AUTO_MERGE="ai-auto-merge-allowed"

          # Helper: structured log
          log_action() {
            local ts
            ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "[agent-session-monitor] ts=$ts $*"
          }

          # Helper: parse explicit truthy values for DRY_RUN
          is_truthy() {
            case "${1:-}" in
              1|true|TRUE|True)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          # Helper: check scan budget
          budget_exceeded() {
            local now
            now=$(date +%s)
            [ $((now - START_EPOCH)) -ge $SCAN_BUDGET_SECONDS ]
          }

          # --- List open PRs ordered by creation date ascending (oldest first) ---
          REPO_OWNER=${GITHUB_REPOSITORY%/*}
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          PR_PAGES=""
          END_CURSOR=""
          NL=$'\n'
          for PAGE in 1 2 3 4 5; do
            if [ -n "$END_CURSOR" ]; then
              PAGE_JSON=$(gh api graphql \
                -f owner="$REPO_OWNER" \
                -f name="$REPO_NAME" \
                -f endCursor="$END_CURSOR" \
                -f query='
                  query($owner: String!, $name: String!, $endCursor: String) {
                    repository(owner: $owner, name: $name) {
                      pullRequests(
                        states: OPEN
                        first: 100
                        after: $endCursor
                        orderBy: { field: CREATED_AT, direction: ASC }
                      ) {
                        nodes {
                          number
                          createdAt
                          isCrossRepository
                          labels(first: 100) {
                            nodes {
                              name
                            }
                          }
                        }
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                      }
                    }
                  }' 2>&1) || {
                echo "::error::Failed to list PRs: $PAGE_JSON"
                exit 1
              }
            else
              PAGE_JSON=$(gh api graphql \
                -f owner="$REPO_OWNER" \
                -f name="$REPO_NAME" \
                -f query='
                  query($owner: String!, $name: String!) {
                    repository(owner: $owner, name: $name) {
                      pullRequests(
                        states: OPEN
                        first: 100
                        orderBy: { field: CREATED_AT, direction: ASC }
                      ) {
                        nodes {
                          number
                          createdAt
                          isCrossRepository
                          labels(first: 100) {
                            nodes {
                              name
                            }
                          }
                        }
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                      }
                    }
                  }' 2>&1) || {
                echo "::error::Failed to list PRs: $PAGE_JSON"
                exit 1
              }
            fi

            PR_PAGES="${PR_PAGES}${PR_PAGES:+${NL}}${PAGE_JSON}"
            HAS_NEXT_PAGE=$(echo "$PAGE_JSON" | jq -r '.data.repository.pullRequests.pageInfo.hasNextPage')
            END_CURSOR=$(echo "$PAGE_JSON" | jq -r '.data.repository.pullRequests.pageInfo.endCursor // empty')

            if [ "$HAS_NEXT_PAGE" != "true" ] || [ -z "$END_CURSOR" ]; then
              break
            fi
          done

          PRS_JSON=$(printf '%s\n' "$PR_PAGES" | jq -sc '
            map(.data.repository.pullRequests.nodes) | add // [] |
            map({
              number,
              createdAt,
              isCrossRepository,
              labels: (.labels.nodes // [])
            })' 2>&1) || {
            echo "::error::Failed to process PR list: $PRS_JSON"
            exit 1
          }

          # Already sorted by CREATED_AT ASC from GraphQL query
          PR_ROWS=$(echo "$PRS_JSON" | jq -c '.[]')

          if [ -z "$PR_ROWS" ]; then
            log_action "action=complete reason=no_open_prs"
            echo "No open PRs found."
            {
              echo "## Agent Session Monitor — PR Scheduler"
              echo ""
              echo "| Metric | Value |"
              echo "| --- | --- |"
              echo "| PRs scanned | 0 |"
              echo "| Selected PR | none |"
              echo "| Dispatches | 0 |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- Evaluate PRs in creation-order (oldest first) ---
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          while IFS= read -r pr_row; do
            [ -z "$pr_row" ] && continue

            # Check scan budget
            if budget_exceeded; then
              log_action "action=budget_exceeded prs_remaining=deferred"
              BUDGET_EXHAUSTED="true"
              break
            fi

            pr=$(echo "$pr_row" | jq -r '.number')
            is_fork=$(echo "$pr_row" | jq -r '.isCrossRepository')
            labels_json=$(echo "$pr_row" | jq -c '[.labels[].name]')
            has_ignore_label=$(echo "$labels_json" | jq -r 'index("'"$LABEL_SKIP"'") != null')
            has_auto_merge_label=$(echo "$labels_json" | jq -r 'index("'"$LABEL_AUTO_MERGE"'") != null')

            PRS_SCANNED=$((PRS_SCANNED + 1))

            # Skip fork PRs
            if [ "$is_fork" = "true" ]; then
              log_action "pr_number=$pr action=skipped reason=fork_pr"
              SKIP_REASONS="${SKIP_REASONS}PR #${pr}: fork; "
              continue
            fi

            # Skip PRs with exclusion label
            if [ "$has_ignore_label" = "true" ]; then
              log_action "pr_number=$pr action=skipped reason=ai_pr_loop_ignore_label"
              SKIP_REASONS="${SKIP_REASONS}PR #${pr}: exclusion_label; "
              continue
            fi

            # --- Check if PR is human-blocked ---
            # Human-blocked = all required status checks pass + has approval + lacks ai-auto-merge-allowed
            # Fetch combined commit status and check runs for the PR head
            PR_STATUS_JSON=$(gh api "/repos/$OWNER/$REPO/pulls/$pr" \
              --jq '{head_sha: .head.sha}' 2>&1) || {
              log_action "pr_number=$pr action=skipped reason=status_fetch_failed"
              SKIP_REASONS="${SKIP_REASONS}PR #${pr}: status_fetch_failed; "
              continue
            }

            HEAD_SHA=$(echo "$PR_STATUS_JSON" | jq -r '.head_sha')

            # Check if PR has an approval
            HAS_APPROVAL=$(gh api "/repos/$OWNER/$REPO/pulls/$pr/reviews" \
              --jq '[.[] | select(.state == "APPROVED")] | length > 0' 2>&1) || HAS_APPROVAL="false"

            # Check combined status (all checks passing)
            COMBINED_STATUS_JSON=$(gh api "/repos/$OWNER/$REPO/commits/$HEAD_SHA/status" \
              --jq '{state: .state, total_count: .total_count}' 2>&1) || COMBINED_STATUS_JSON='{"state":"unknown","total_count":-1}'
            COMBINED_STATE=$(echo "$COMBINED_STATUS_JSON" | jq -r '.state // "unknown"')
            COMBINED_TOTAL_COUNT=$(echo "$COMBINED_STATUS_JSON" | jq -r '.total_count // -1')

            # Check check-runs conclusion
            CHECK_RUNS_OK="true"
            CHECK_RUNS_JSON=$(gh api "/repos/$OWNER/$REPO/commits/$HEAD_SHA/check-runs" \
              --jq '[.check_runs[] | select((.status != "completed") or (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length' 2>&1) || CHECK_RUNS_JSON="-1"
            if [ "$CHECK_RUNS_JSON" != "0" ]; then
              CHECK_RUNS_OK="false"
            fi

            # Determine if merge-ready: has approval + CI passing
            # CI is passing when check-runs are clean and either:
            #   - combined status reports success, or
            #   - combined status has no legacy statuses (total_count == 0)
            CI_PASSING="false"
            if [ "$CHECK_RUNS_OK" = "true" ] && {
              [ "$COMBINED_STATE" = "success" ] || [ "$COMBINED_TOTAL_COUNT" = "0" ];
            }; then
              CI_PASSING="true"
            fi

            # Human-blocked: merge-ready (CI passing + approved) but missing ai-auto-merge-allowed
            if [ "$CI_PASSING" = "true" ] && [ "$HAS_APPROVAL" = "true" ] && [ "$has_auto_merge_label" != "true" ]; then
              log_action "pr_number=$pr action=skipped reason=human_blocked detail=merge_ready_missing_auto_merge_label"
              SKIP_REASONS="${SKIP_REASONS}PR #${pr}: human_blocked; "
              continue
            fi

            # --- PR is eligible — select it ---
            SELECTED_PR="$pr"
            log_action "pr_number=$pr action=selected reason=oldest_eligible"

            if is_truthy "${DRY_RUN:-}"; then
              log_action "pr_number=$pr action=dispatched mode=dry_run"
              DISPATCHES=1
            else
              if gh workflow run ai-pr-loop.yml \
                --repo "$GITHUB_REPOSITORY" \
                --field pr_number="$pr" \
                --field trigger_reason=scheduler_oldest_eligible; then
                log_action "pr_number=$pr action=dispatched trigger_reason=scheduler_oldest_eligible"
                DISPATCHES=1
              else
                log_action "pr_number=$pr action=error reason=dispatch_failed"
                echo "::error::Failed to dispatch ai-pr-loop for PR #$pr"
                exit 1
              fi
            fi

            # Only dispatch one PR per cycle — break after first eligible
            break
          done <<< "$PR_ROWS"

          # --- Summary output ---
          if [ -z "$SELECTED_PR" ]; then
            if [ "$BUDGET_EXHAUSTED" = "true" ]; then
              log_action "action=complete reason=budget_exhausted prs_scanned=$PRS_SCANNED"
            else
              log_action "action=complete reason=no_eligible_pr prs_scanned=$PRS_SCANNED"
            fi
          else
            log_action "action=complete selected_pr=$SELECTED_PR prs_scanned=$PRS_SCANNED dispatches=$DISPATCHES"
          fi

          {
            echo "## Agent Session Monitor — PR Scheduler"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| PRs scanned | $PRS_SCANNED |"
            echo "| Selected PR | ${SELECTED_PR:-none} |"
            echo "| Dispatches | $DISPATCHES |"
          } >> "$GITHUB_STEP_SUMMARY"
