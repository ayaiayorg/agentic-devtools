# Agent Session Monitor
#
# Detects when a Copilot (or similar AI agent) session finishes on an open PR
# and triggers the AI PR loop workflow for immediate post-session processing.
#
# Design:
#   - Polls BOTH the GitHub Issues Events API AND the Copilot sessions API
#     every 5 minutes for terminal session events.
#   - Also checks the Reviews API for Copilot review completions.
#   - Deduplicates using a durable per-PR marker comment (upsert pattern)
#     instead of fragile actions/cache.
#   - Dispatches ai-pr-loop.yml via workflow_dispatch (PAT-triggered, no
#     approval required) with pr_number and trigger_reason fields.
#   - Coexists with all existing ai-pr-loop.yml triggers. The ai-pr-loop
#     concurrency group (ai-pr-loop-{pr_number}) serializes any concurrent
#     runs for the same PR.
#
# Related:
#   - ai-pr-loop.yml — target workflow (unchanged by this feature)
#   - Issue #1587: Feature: Add webhook or event-driven trigger for ai-pr-loop
#   - Issue #1659: RFC: Replace pollers with unified monitor
#
# FR Traceability:
#   FR-001: Dual-source detection (agent-task CLI + events API)
#   FR-002: Comment-based deduplication (replaces actions/cache)
#   FR-003: Passes pr_number input to ai-pr-loop.yml
#   FR-004: Copilot review detection via Reviews API
#   FR-005: Dead code removal (squash-wait-scheduler, approval-monitor deleted)
#   FR-007: Handles both copilot_work_finished and copilot_work_finished_failure
#   FR-008: Write permissions for issues and pull-requests
#   FR-009: Graceful fallback if agent-task list fails

name: Agent Session Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes (FR-001: ≤300s detection latency)
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  actions: write
  issues: write

jobs:
  monitor-agent-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: agent-session-monitor
      cancel-in-progress: false

    steps:
      - name: Scan and dispatch
        id: scan
        env:
          GH_TOKEN: ${{ secrets.AGDT_PR_APPROVER_PAT }}
          DRY_RUN: ${{ vars.AGENT_MONITOR_DRY_RUN || '' }}
          AGENT_MONITOR_MAX_EVENT_AGE: ${{ vars.AGENT_MONITOR_MAX_EVENT_AGE || '' }}
          AGENT_MONITOR_MAX_PRS_PER_CYCLE: ${{ vars.AGENT_MONITOR_MAX_PRS_PER_CYCLE || '50' }}
          AGENT_MONITOR_MAX_TRACKED_SESSIONS: ${{ vars.AGENT_MONITOR_MAX_TRACKED_SESSIONS || '200' }}
        run: |
          set -uo pipefail

          # --- Initialization ---
          START_EPOCH=$(date +%s)
          # Reserve ~30s for final steps.
          SCAN_BUDGET_SECONDS=330
          # Recency boundary: ignore events older than this many seconds.
          MAX_EVENT_AGE_SECONDS="${AGENT_MONITOR_MAX_EVENT_AGE:-600}"
          if ! [[ "$MAX_EVENT_AGE_SECONDS" =~ ^[0-9]+$ ]]; then
            echo "::warning::AGENT_MONITOR_MAX_EVENT_AGE='$MAX_EVENT_AGE_SECONDS' is not numeric; defaulting to 600"
            MAX_EVENT_AGE_SECONDS=600
          fi
          MAX_PRS="${AGENT_MONITOR_MAX_PRS_PER_CYCLE:-50}"
          MAX_TRACKED_SESSIONS="${AGENT_MONITOR_MAX_TRACKED_SESSIONS:-200}"
          if ! [[ "$MAX_TRACKED_SESSIONS" =~ ^[0-9]+$ ]] || [ "$MAX_TRACKED_SESSIONS" -lt 1 ]; then
            echo "::warning::AGENT_MONITOR_MAX_TRACKED_SESSIONS='$MAX_TRACKED_SESSIONS' is invalid; defaulting to 200"
            MAX_TRACKED_SESSIONS=200
          fi
          DISPATCHES=0
          EVENTS_FOUND=0
          EVENTS_SKIPPED_STALE=0
          PRS_SCANNED=0
          SCAN_ERRORS=0
          AGENT_TASK_AVAILABLE=true
          TRACKER_MARKER="<!-- agent-session-tracker"
          TERMINAL_EVENTS="copilot_work_finished copilot_work_finished_failure"

          # Helper: structured log
          log_action() {
            local ts
            ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "[agent-session-monitor] ts=$ts $*"
          }

          # Helper: parse explicit truthy values for DRY_RUN
          is_truthy() {
            case "${1:-}" in
              1|true|TRUE|True)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          # Helper: check scan budget
          budget_exceeded() {
            local now
            now=$(date +%s)
            [ $((now - START_EPOCH)) -ge $SCAN_BUDGET_SECONDS ]
          }

          # Helper: check if session ID is tracked in existing comment body
          is_tracked() {
            local session_id="$1"
            local comment_body="$2"
            echo "$comment_body" | grep -qF "| $session_id |"
          }

          # --- Detect agent tasks (FR-001, FR-009: graceful fallback) ---
          AGENT_TASKS_JSON="[]"
          if ! AGENT_TASKS_JSON=$(gh api "/repos/${GITHUB_REPOSITORY}/copilot/pull-requests/sessions" \
            --jq '[.[] | {id: .id, status: .status, pullRequestNumber: .pull_request_number, createdAt: .created_at}]' 2>&1); then
            log_action "action=warning reason=agent_task_list_failed error=\"$AGENT_TASKS_JSON\""
            echo "::warning::Copilot sessions API (/copilot/pull-requests/sessions) failed; continuing with events-api + reviews-api only"
            AGENT_TASKS_JSON="[]"
            AGENT_TASK_AVAILABLE=false
          fi

          # --- List eligible open PRs ---
          REPO_OWNER=${GITHUB_REPOSITORY%/*}
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          PR_PAGES=""
          END_CURSOR=""
          NL=$'\n'
          for PAGE in 1 2 3 4 5; do
            if [ -n "$END_CURSOR" ]; then
              PAGE_JSON=$(gh api graphql \
                -f owner="$REPO_OWNER" \
                -f name="$REPO_NAME" \
                -f endCursor="$END_CURSOR" \
                -f query='
                  query($owner: String!, $name: String!, $endCursor: String) {
                    repository(owner: $owner, name: $name) {
                      pullRequests(
                        states: OPEN
                        first: 100
                        after: $endCursor
                        orderBy: { field: UPDATED_AT, direction: DESC }
                      ) {
                        nodes {
                          number
                          isCrossRepository
                          updatedAt
                          labels(first: 100) {
                            nodes {
                              name
                            }
                          }
                        }
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                      }
                    }
                  }' 2>&1) || {
                echo "::error::Failed to list PRs: $PAGE_JSON"
                exit 1
              }
            else
              PAGE_JSON=$(gh api graphql \
                -f owner="$REPO_OWNER" \
                -f name="$REPO_NAME" \
                -f query='
                  query($owner: String!, $name: String!, $endCursor: String) {
                    repository(owner: $owner, name: $name) {
                      pullRequests(
                        states: OPEN
                        first: 100
                        after: $endCursor
                        orderBy: { field: UPDATED_AT, direction: DESC }
                      ) {
                        nodes {
                          number
                          isCrossRepository
                          updatedAt
                          labels(first: 100) {
                            nodes {
                              name
                            }
                          }
                        }
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                      }
                    }
                  }' 2>&1) || {
                echo "::error::Failed to list PRs: $PAGE_JSON"
                exit 1
              }
            fi

            PR_PAGES="${PR_PAGES}${PR_PAGES:+${NL}}${PAGE_JSON}"
            HAS_NEXT_PAGE=$(echo "$PAGE_JSON" | jq -r '.data.repository.pullRequests.pageInfo.hasNextPage')
            END_CURSOR=$(echo "$PAGE_JSON" | jq -r '.data.repository.pullRequests.pageInfo.endCursor // empty')

            if [ "$HAS_NEXT_PAGE" != "true" ] || [ -z "$END_CURSOR" ]; then
              break
            fi
          done

          PRS_JSON=$(printf '%s\n' "$PR_PAGES" | jq -sc '
            map(.data.repository.pullRequests.nodes) | add | .[:500] |
            map({
              number,
              isCrossRepository,
              updatedAt,
              labels: (.labels.nodes // [])
            })' 2>&1) || {
            echo "::error::Failed to process PR list: $PRS_JSON"
            exit 1
          }

          # Sort by updatedAt desc and limit to MAX_PRS per cycle (round-robin batching)
          PR_ROWS=$(echo "$PRS_JSON" | jq -c "sort_by(.updatedAt) | reverse | .[:$MAX_PRS] | .[]")

          if [ -z "$PR_ROWS" ]; then
            log_action "action=complete reason=no_open_prs"
            echo "No open PRs found."
            {
              echo "## Agent Session Monitor"
              echo ""
              echo "| Metric | Value |"
              echo "| --- | --- |"
              echo "| PRs scanned | 0 |"
              echo "| Events found | 0 |"
              echo "| Dispatches issued | 0 |"
              echo "| Errors | 0 |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- Scan each PR for terminal events ---
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          while IFS= read -r pr_row; do
            [ -z "$pr_row" ] && continue

            # Check scan budget
            if budget_exceeded; then
              log_action "action=budget_exceeded prs_remaining=deferred"
              break
            fi

            pr=$(echo "$pr_row" | jq -r '.number')
            is_fork=$(echo "$pr_row" | jq -r '.isCrossRepository')
            has_ignore_label=$(echo "$pr_row" | jq -r '[.labels[].name] | index("ai-pr-loop-ignore") != null')

            PRS_SCANNED=$((PRS_SCANNED + 1))

            if [ "$is_fork" = "true" ]; then
              log_action "pr_number=$pr action=skipped reason=fork_pr"
              continue
            fi

            if [ "$has_ignore_label" = "true" ]; then
              log_action "pr_number=$pr action=skipped reason=ai_pr_loop_ignore_label"
              continue
            fi

            # Per-PR error isolation
            {
              # --- Read existing tracker comment for this PR (FR-002) ---
              EXISTING_COMMENT_BODY=""
              EXISTING_COMMENT_ID=""
              COMMENTS_JSON=$(gh api "/repos/$OWNER/$REPO/issues/$pr/comments" \
                --jq "[.[] | select(.body | startswith(\"$TRACKER_MARKER\"))]" 2>&1) || {
                log_action "pr_number=$pr action=warning reason=comment_fetch_failed"
                COMMENTS_JSON="[]"
              }
              if [ "$(echo "$COMMENTS_JSON" | jq 'length')" -gt 0 ]; then
                EXISTING_COMMENT_BODY=$(echo "$COMMENTS_JSON" | jq -r '.[0].body')
                EXISTING_COMMENT_ID=$(echo "$COMMENTS_JSON" | jq -r '.[0].id')
              fi

              # --- Source 1: Events API (FR-007) ---
              EVENTS_JSON=$(gh api "/repos/$OWNER/$REPO/issues/$pr/events" \
                --paginate \
                --jq "[.[] | select(.event == \"copilot_work_finished\" or .event == \"copilot_work_finished_failure\")]" \
                2>&1) || {
                log_action "pr_number=$pr action=error reason=events_api_failed error=\"$EVENTS_JSON\""
                echo "::warning::Failed to fetch events for PR #$pr"
                SCAN_ERRORS=$((SCAN_ERRORS + 1))
                continue
              }

              # --- Source 2: Agent tasks for this PR (FR-001) ---
              PR_AGENT_TASKS=$(echo "$AGENT_TASKS_JSON" | jq -c "[.[] | select(.pullRequestNumber == $pr)]")

              # --- Source 3: Reviews API for Copilot reviews (FR-004) ---
              REVIEWS_JSON=$(gh api "/repos/$OWNER/$REPO/pulls/$pr/reviews" \
                --jq '[.[] | select(.user.login == "Copilot" or .user.login == "copilot-pull-request-reviewer[bot]") | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "COMMENTED")]' \
                2>&1) || {
                log_action "pr_number=$pr action=warning reason=reviews_api_failed"
                REVIEWS_JSON="[]"
              }

              # --- Process events and determine new sessions ---
              NEW_SESSIONS_DISPATCHED=false
              PR_DISPATCH_DONE=false  # Deduplicate: at most one dispatch per PR per tick
              # Collect ALL session IDs for this PR (existing + new)
              ALL_SESSION_IDS=""
              # Extract existing session IDs from the comment body
              if [ -n "$EXISTING_COMMENT_BODY" ]; then
                while IFS= read -r existing_id; do
                  [ -z "$existing_id" ] && continue
                  ALL_SESSION_IDS="${ALL_SESSION_IDS}${ALL_SESSION_IDS:+ }${existing_id}"
                done < <(echo "$EXISTING_COMMENT_BODY" | grep -oP '(event-\d+|task-[^\s|]+|review-\d+)' | sort -u)
              fi

              # Process events API sessions
              while IFS= read -r row; do
                [ -z "$row" ] && continue
                EVENT_ID=$(echo "$row" | jq '.id')
                EVENT_TYPE=$(echo "$row" | jq -r '.event')
                SESSION_ID="event-$EVENT_ID"
                EVENTS_FOUND=$((EVENTS_FOUND + 1))

                # Recency boundary
                EVENT_CREATED=$(echo "$row" | jq -r '.created_at // empty')
                if [ -n "$EVENT_CREATED" ]; then
                  EVENT_EPOCH=$(date -d "$EVENT_CREATED" +%s 2>/dev/null || echo "0")
                  EVENT_AGE=$(( $(date +%s) - EVENT_EPOCH ))
                  if [ "$EVENT_AGE" -gt "$MAX_EVENT_AGE_SECONDS" ]; then
                    log_action "pr_number=$pr event_id=$EVENT_ID event_type=$EVENT_TYPE action=skipped reason=stale_event age=${EVENT_AGE}s max=${MAX_EVENT_AGE_SECONDS}s"
                    EVENTS_SKIPPED_STALE=$((EVENTS_SKIPPED_STALE + 1))
                    continue
                  fi
                fi

                # Comment-based deduplication (FR-002)
                if is_tracked "$SESSION_ID" "$EXISTING_COMMENT_BODY"; then
                  log_action "pr_number=$pr event_id=$EVENT_ID event_type=$EVENT_TYPE action=skipped reason=already_tracked"
                  continue
                fi

                # Dispatch ai-pr-loop (FR-003) — at most once per PR per tick
                if is_truthy "${DRY_RUN:-}"; then
                  log_action "pr_number=$pr event_id=$EVENT_ID event_type=$EVENT_TYPE action=dispatched mode=dry_run"
                  DISPATCHES=$((DISPATCHES + 1))
                  NEW_SESSIONS_DISPATCHED=true
                  PR_DISPATCH_DONE=true
                  ALL_SESSION_IDS="${ALL_SESSION_IDS}${ALL_SESSION_IDS:+ }${SESSION_ID}"
                elif [ "$PR_DISPATCH_DONE" = "true" ]; then
                  log_action "pr_number=$pr event_id=$EVENT_ID event_type=$EVENT_TYPE action=tracked reason=dispatch_already_queued"
                  NEW_SESSIONS_DISPATCHED=true
                  ALL_SESSION_IDS="${ALL_SESSION_IDS}${ALL_SESSION_IDS:+ }${SESSION_ID}"
                else
                  if gh workflow run ai-pr-loop.yml \
                    --repo "$GITHUB_REPOSITORY" \
                    --field pr_number="$pr" \
                    --field trigger_reason=agent_session_finished; then
                    log_action "pr_number=$pr event_id=$EVENT_ID event_type=$EVENT_TYPE action=dispatched"
                    DISPATCHES=$((DISPATCHES + 1))
                    NEW_SESSIONS_DISPATCHED=true
                    PR_DISPATCH_DONE=true
                    ALL_SESSION_IDS="${ALL_SESSION_IDS}${ALL_SESSION_IDS:+ }${SESSION_ID}"
                  else
                    log_action "pr_number=$pr event_id=$EVENT_ID event_type=$EVENT_TYPE action=error reason=dispatch_failed"
                    echo "::error::Failed to dispatch ai-pr-loop for PR #$pr (event $EVENT_ID)"
                    SCAN_ERRORS=$((SCAN_ERRORS + 1))
                  fi
                fi
              done < <(echo "$EVENTS_JSON" | jq -c '.[]')

              # Process agent-task sessions
              while IFS= read -r task_row; do
                [ -z "$task_row" ] && continue
                TASK_ID=$(echo "$task_row" | jq -r '.id')
                TASK_STATUS=$(echo "$task_row" | jq -r '.status')
                SESSION_ID="task-$TASK_ID"

                # Only process completed tasks
                if [ "$TASK_STATUS" != "completed" ] && [ "$TASK_STATUS" != "failed" ]; then
                  continue
                fi

                # Comment-based deduplication (FR-002)
                if is_tracked "$SESSION_ID" "$EXISTING_COMMENT_BODY"; then
                  continue
                fi

                # Dispatch
                if is_truthy "${DRY_RUN:-}"; then
                  log_action "pr_number=$pr task_id=$TASK_ID action=dispatched mode=dry_run source=agent-task"
                  DISPATCHES=$((DISPATCHES + 1))
                  NEW_SESSIONS_DISPATCHED=true
                  PR_DISPATCH_DONE=true
                  ALL_SESSION_IDS="${ALL_SESSION_IDS}${ALL_SESSION_IDS:+ }${SESSION_ID}"
                elif [ "$PR_DISPATCH_DONE" = "true" ]; then
                  log_action "pr_number=$pr task_id=$TASK_ID action=tracked reason=dispatch_already_queued source=agent-task"
                  NEW_SESSIONS_DISPATCHED=true
                  ALL_SESSION_IDS="${ALL_SESSION_IDS}${ALL_SESSION_IDS:+ }${SESSION_ID}"
                else
                  if gh workflow run ai-pr-loop.yml \
                    --repo "$GITHUB_REPOSITORY" \
                    --field pr_number="$pr" \
                    --field trigger_reason=agent_session_finished; then
                    log_action "pr_number=$pr task_id=$TASK_ID action=dispatched source=agent-task"
                    DISPATCHES=$((DISPATCHES + 1))
                    NEW_SESSIONS_DISPATCHED=true
                    PR_DISPATCH_DONE=true
                    ALL_SESSION_IDS="${ALL_SESSION_IDS}${ALL_SESSION_IDS:+ }${SESSION_ID}"
                  else
                    log_action "pr_number=$pr task_id=$TASK_ID action=error reason=dispatch_failed source=agent-task"
                    SCAN_ERRORS=$((SCAN_ERRORS + 1))
                  fi
                fi
              done < <(echo "$PR_AGENT_TASKS" | jq -c '.[]')

              # Process Copilot review completions (FR-004)
              while IFS= read -r review_row; do
                [ -z "$review_row" ] && continue
                REVIEW_ID=$(echo "$review_row" | jq -r '.id')
                SESSION_ID="review-$REVIEW_ID"

                if is_tracked "$SESSION_ID" "$EXISTING_COMMENT_BODY"; then
                  continue
                fi

                if is_truthy "${DRY_RUN:-}"; then
                  log_action "pr_number=$pr review_id=$REVIEW_ID action=dispatched mode=dry_run source=reviews-api"
                  DISPATCHES=$((DISPATCHES + 1))
                  NEW_SESSIONS_DISPATCHED=true
                  PR_DISPATCH_DONE=true
                  ALL_SESSION_IDS="${ALL_SESSION_IDS}${ALL_SESSION_IDS:+ }${SESSION_ID}"
                elif [ "$PR_DISPATCH_DONE" = "true" ]; then
                  log_action "pr_number=$pr review_id=$REVIEW_ID action=tracked reason=dispatch_already_queued source=reviews-api"
                  NEW_SESSIONS_DISPATCHED=true
                  ALL_SESSION_IDS="${ALL_SESSION_IDS}${ALL_SESSION_IDS:+ }${SESSION_ID}"
                else
                  if gh workflow run ai-pr-loop.yml \
                    --repo "$GITHUB_REPOSITORY" \
                    --field pr_number="$pr" \
                    --field trigger_reason=agent_session_finished; then
                    log_action "pr_number=$pr review_id=$REVIEW_ID action=dispatched source=reviews-api"
                    DISPATCHES=$((DISPATCHES + 1))
                    NEW_SESSIONS_DISPATCHED=true
                    PR_DISPATCH_DONE=true
                    ALL_SESSION_IDS="${ALL_SESSION_IDS}${ALL_SESSION_IDS:+ }${SESSION_ID}"
                  else
                    log_action "pr_number=$pr review_id=$REVIEW_ID action=error reason=dispatch_failed source=reviews-api"
                    SCAN_ERRORS=$((SCAN_ERRORS + 1))
                  fi
                fi
              done < <(echo "$REVIEWS_JSON" | jq -c '.[]')

              # --- Update tracker comment (FR-002, FR-007) ---
              # Always upsert when there are tracked sessions (even without new dispatches)
              # so that already-seen session IDs stay recorded for future dedup.
              if [ -n "$ALL_SESSION_IDS" ] && ! is_truthy "${DRY_RUN:-}"; then
                NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                # Cap tracked sessions to avoid exceeding comment size limits.
                read -r -a SESSION_ID_ARRAY <<< "$ALL_SESSION_IDS"
                if [ "${#SESSION_ID_ARRAY[@]}" -gt "$MAX_TRACKED_SESSIONS" ]; then
                  START_INDEX=$((${#SESSION_ID_ARRAY[@]} - MAX_TRACKED_SESSIONS))
                  ALL_SESSION_IDS="${SESSION_ID_ARRAY[*]:$START_INDEX}"
                fi
                # Build tracker body with session ID table for grep-based dedup
                SESSION_TABLE=""
                for sid in $ALL_SESSION_IDS; do
                  SESSION_TABLE+="| $sid | dispatched |"$'\n'
                done
                TRACKER_BODY="$(printf '%s\nlast_checked=%s\n-->\n## Agent Sessions for PR #%s\n\n_Last updated: %s_\n\n| Session ID | Status |\n|---|---|\n%s' \
                  "$TRACKER_MARKER" "$NOW" "$pr" "$NOW" "$SESSION_TABLE")"

                if [ -n "$EXISTING_COMMENT_ID" ]; then
                  gh api "/repos/$OWNER/$REPO/issues/comments/$EXISTING_COMMENT_ID" \
                    --method PATCH \
                    --field body="$TRACKER_BODY" > /dev/null 2>&1 || \
                    log_action "pr_number=$pr action=warning reason=comment_update_failed"
                else
                  gh api "/repos/$OWNER/$REPO/issues/$pr/comments" \
                    --method POST \
                    --field body="$TRACKER_BODY" > /dev/null 2>&1 || \
                    log_action "pr_number=$pr action=warning reason=comment_create_failed"
                fi
              fi
            } || {
              SCAN_ERRORS=$((SCAN_ERRORS + 1))
              log_action "pr_number=$pr action=error reason=unexpected_failure"
              echo "::warning::Unexpected error scanning PR #$pr"
            }
          done <<< "$PR_ROWS"

          # --- Summary output ---
          log_action "action=complete prs_scanned=$PRS_SCANNED events_found=$EVENTS_FOUND events_skipped_stale=$EVENTS_SKIPPED_STALE dispatches=$DISPATCHES errors=$SCAN_ERRORS agent_task_available=$AGENT_TASK_AVAILABLE"

          {
            echo "## Agent Session Monitor"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| PRs scanned | $PRS_SCANNED |"
            echo "| Events found | $EVENTS_FOUND |"
            echo "| Events skipped (stale) | $EVENTS_SKIPPED_STALE |"
            echo "| Dispatches issued | $DISPATCHES |"
            echo "| Agent-task available | $AGENT_TASK_AVAILABLE |"
            echo "| Errors | $SCAN_ERRORS |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SCAN_ERRORS" -gt 0 ]; then
            echo "::error::Agent session monitor completed with $SCAN_ERRORS scan error(s). See logs above for details."
            exit 1
          fi
