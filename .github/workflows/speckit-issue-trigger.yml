name: SpecKit Issue Trigger

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process (for manual testing)'
        required: true
        type: number
      trigger_label:
        description: 'Label that triggers the SDD process (overrides SPECKIT_TRIGGER_LABEL variable)'
        required: false
        default: 'speckit'
        type: string

# Prevent concurrent runs on the same issue
concurrency:
  group: speckit-trigger-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  SPEC_BASE_PATH: specs
  # The label that triggers the SDD process
  # Priority: workflow_dispatch input > repository variable > default 'speckit'
  TRIGGER_LABEL: ${{ inputs.trigger_label || vars.SPECKIT_TRIGGER_LABEL || 'speckit' }}
  # Model for Copilot SDK spec generation
  # Priority: repository variable > default 'claude-opus-4.6'
  COPILOT_MODEL: ${{ vars.SPECKIT_COPILOT_MODEL || 'claude-opus-4.6' }}

jobs:
  validate-and-trigger:
    name: Validate Label and Trigger SpecKit
    runs-on: ubuntu-latest
    # Only run if the added label matches the trigger label, or manual dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == vars.SPECKIT_TRIGGER_LABEL ||
      github.event.label.name == 'speckit'

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      branch_name: ${{ steps.commit.outputs.branch_name }}
      spec_file: ${{ steps.generate.outputs.spec_file }}
      spec_dir: ${{ steps.commit.outputs.spec_dir || steps.generate.outputs.spec_dir }}
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
      skipped: ${{ steps.idempotency.outputs.skipped }}

    steps:
      - name: Debug Event
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Label: ${{ github.event.label.name || 'manual' }}"
          echo "Issue Number: ${{ github.event.issue.number || inputs.issue_number }}"
          echo "Trigger Label: ${{ env.TRIGGER_LABEL }}"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Label
        id: validate-label
        run: |
          chmod +x .github/scripts/speckit-trigger/validate-label.sh
          # For workflow_dispatch, skip label validation (label was provided manually)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "label_matches=true" >> "$GITHUB_OUTPUT"
            echo "✓ Manual dispatch — skipping label validation"
          else
            .github/scripts/speckit-trigger/validate-label.sh \
              "${{ github.event.label.name }}" \
              "${{ env.TRIGGER_LABEL }}" || true
          fi

      # Step 1: Post acknowledgment comment immediately (< 30 seconds target)
      - name: Post Started Comment
        id: started-comment
        if: steps.validate-label.outputs.label_matches == 'true' && vars.SPECKIT_COMMENT_ON_ISSUE != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue?.number || ${{ inputs.issue_number || 0 }};

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '## 🚀 SpecKit: Phase 1 (Specify) Started',
                '',
                "I'm generating the initial feature specification (spec.md) for this issue. This is Phase 1 of the SpecKit pipeline.",
                '',
                '**Phase**: 1/5 — Specify',
                '**Status**: In Progress',
                `**Triggered by**: \`${{ env.TRIGGER_LABEL }}\` label`,
                '',
                '**Next Steps**: After Phase 1 completes and the PR is merged, subsequent phases (clarify → plan → tasks → analyze) will be triggered automatically as separate PRs.',
                '',
                '---',
                `_This comment was posted by the [SpecKit GitHub Action](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`
              ].join('\n')
            });

      - name: Transition Labels (Started)
        if: steps.validate-label.outputs.label_matches == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue?.number || ${{ inputs.issue_number || 0 }};

            // Replace trigger label with processing label
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: '${{ env.TRIGGER_LABEL }}'
              });
            } catch (e) {
              console.log('Could not remove trigger label:', e.message);
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['speckit:processing']
              });
            } catch (e) {
              console.log('Could not add processing label:', e.message);
            }

      - name: Get Issue Details
        id: issue
        if: steps.validate-label.outputs.label_matches == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue?.number || ${{ inputs.issue_number || 0 }};

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            core.setOutput('number', issue.number);
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || '');
            core.setOutput('url', issue.html_url);
            core.setOutput('labels', JSON.stringify(issue.labels.map(l => l.name)));

            return issue;

      - name: Check Idempotency
        id: idempotency
        if: steps.validate-label.outputs.label_matches == 'true'
        run: |
          chmod +x .github/scripts/speckit-trigger/check-idempotency.sh
          .github/scripts/speckit-trigger/check-idempotency.sh "${{ steps.issue.outputs.number }}" --phase 1

      - name: Post Already Processed Comment
        if: steps.idempotency.outputs.skipped == 'true' && vars.SPECKIT_COMMENT_ON_ISSUE != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.issue.outputs.number }};
            const existingSpec = '${{ steps.idempotency.outputs.existing_spec }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '## ℹ️ SpecKit: Specification Already Exists',
                '',
                'A specification for this issue has already been created.',
                '',
                `**Existing Spec**: [\`${existingSpec}\`](${existingSpec})`,
                '',
                'If you need to regenerate the specification, please delete the existing spec directory first.',
                '',
                '---',
                `_This comment was posted by the [SpecKit GitHub Action](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`
              ].join('\n')
            });

            // Remove processing label
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'speckit:processing'
              });
            } catch (e) {}

      # Remove speckit:processing when idempotency skips — decoupled from comment toggle
      # so the label is cleaned up even when SPECKIT_COMMENT_ON_ISSUE is disabled
      - name: Cleanup Labels (Skipped)
        if: steps.idempotency.outputs.skipped == 'true' && vars.SPECKIT_COMMENT_ON_ISSUE == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue?.number || ${{ inputs.issue_number || 0 }};
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'speckit:processing'
              });
            } catch (e) {
              console.log('Could not remove speckit:processing label:', e.message);
            }

      - name: Sanitize Branch Name
        if: steps.validate-label.outputs.label_matches == 'true' && steps.idempotency.outputs.skipped != 'true'
        id: sanitize
        run: |
          chmod +x .github/scripts/speckit-trigger/sanitize-branch-name.sh
          .github/scripts/speckit-trigger/sanitize-branch-name.sh "${{ steps.issue.outputs.title }}"

      - name: Validate Tokens
        if: steps.validate-label.outputs.label_matches == 'true' && steps.idempotency.outputs.skipped != 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error::COPILOT_GITHUB_TOKEN secret is not set. This PAT is required for Copilot SDK authentication and PR creation. Configure the COPILOT_GITHUB_TOKEN secret with a PAT that has Copilot API access and repo permissions."
            exit 1
          fi
          echo "✓ COPILOT_GITHUB_TOKEN is set"

      - name: Set up Python
        if: steps.validate-label.outputs.label_matches == 'true' && steps.idempotency.outputs.skipped != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.validate-label.outputs.label_matches == 'true' && steps.idempotency.outputs.skipped != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install github-copilot-sdk
          python -m pip install . --no-deps

      - name: Generate Specification
        if: steps.validate-label.outputs.label_matches == 'true' && steps.idempotency.outputs.skipped != 'true'
        id: generate
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          SHORT_NAME: ${{ steps.sanitize.outputs.short_name }}
          COPILOT_MODEL: ${{ env.COPILOT_MODEL }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SPECKIT_COPILOT_CLI_ON_STALL: ${{ vars.SPECKIT_COPILOT_CLI_ON_STALL || 'true' }}
        run: |
          chmod +x .github/scripts/speckit-trigger/generate-spec-from-issue.sh
          .github/scripts/speckit-trigger/generate-spec-from-issue.sh --phase 1

      - name: Commit Specification Artifacts
        if: steps.validate-label.outputs.label_matches == 'true' && steps.idempotency.outputs.skipped != 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          ISSUE_NUMBER="${{ steps.issue.outputs.number }}"
          # Use per-phase branch naming convention
          BRANCH_NAME="speckit/${ISSUE_NUMBER}/phase-1-specify"

          # Fetch the remote branch so the remote-tracking ref is current, but do not
          # check out origin/$BRANCH_NAME after artifacts have been generated because
          # untracked generated files can cause checkout to fail on reruns (FR-013).
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch '$BRANCH_NAME' already exists on remote — fetching and resetting local branch from current HEAD"
            git fetch origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
            git checkout -B "$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi

          # Add all generated artifacts in the spec directory
          SPEC_DIR="${{ steps.generate.outputs.spec_dir }}"
          if [[ -z "$SPEC_DIR" ]]; then
            SPEC_DIR="$(dirname "${{ steps.generate.outputs.spec_file }}")"
          fi
          if [[ -z "$SPEC_DIR" || "$SPEC_DIR" == "." ]]; then
            echo "Error: Could not determine spec directory from generate step outputs" >&2
            exit 1
          fi
          # Propagate resolved values for downstream steps
          echo "spec_dir=$SPEC_DIR" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          git add "$SPEC_DIR"

          git commit -m "spec(specify): Phase 1 specification artifacts for issue #${{ steps.issue.outputs.number }}

          Generated from: ${{ steps.issue.outputs.url }}

          Phase 1 (specify) artifacts generated by the SpecKit pipeline.

          Relates to #${{ steps.issue.outputs.number }}"

      - name: Push Branch
        if: steps.validate-label.outputs.label_matches == 'true' && steps.idempotency.outputs.skipped != 'true' && vars.SPECKIT_CREATE_BRANCH != 'false'
        run: |
          BRANCH_NAME="${{ steps.commit.outputs.branch_name }}"
          git push --force-with-lease -u origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.validate-label.outputs.label_matches == 'true' && steps.idempotency.outputs.skipped != 'true' && vars.SPECKIT_CREATE_BRANCH != 'false' && vars.SPECKIT_CREATE_PR != 'false'
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.SPECKIT_PR_TOKEN || secrets.COPILOT_GITHUB_TOKEN }}
          ISSUE_LABELS: ${{ steps.issue.outputs.labels }}
          MARKDOWNLINT_WARNINGS: ${{ steps.generate.outputs.markdownlint_remaining_violations }}
        run: |
          chmod +x .github/scripts/speckit-trigger/create-spec-pr.sh

          # Build markdownlint warnings argument
          LINT_ARGS=()
          if [[ -n "${MARKDOWNLINT_WARNINGS:-}" ]]; then
            LINT_ARGS+=(--markdownlint-warnings "$MARKDOWNLINT_WARNINGS")
          fi

          .github/scripts/speckit-trigger/create-spec-pr.sh \
            "${{ steps.commit.outputs.branch_name }}" \
            "${{ steps.commit.outputs.spec_dir || steps.generate.outputs.spec_dir }}" \
            "${{ steps.issue.outputs.number }}" \
            "${{ steps.issue.outputs.title }}" \
            "$ISSUE_LABELS" \
            --phase-number 1 \
            --phase-name specify \
            "${LINT_ARGS[@]}"

      - name: Post Completed Comment
        if: steps.validate-label.outputs.label_matches == 'true' && steps.idempotency.outputs.skipped != 'true' && vars.SPECKIT_COMMENT_ON_ISSUE != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.issue.outputs.number }};
            const branchName = '${{ steps.commit.outputs.branch_name }}';
            const prUrl = '${{ steps.create-pr.outputs.pr_url }}' || null;
            const specDir = '${{ steps.commit.outputs.spec_dir || steps.generate.outputs.spec_dir }}';

            const branchPushed = '${{ vars.SPECKIT_CREATE_BRANCH }}' !== 'false';

            const lines = [
              '## ✅ SpecKit: Phase 1 (Specify) Completed',
              '',
              'The initial specification has been generated for this issue.',
              '',
              `**Phase**: 1/5 — Specify`,
              `**Branch**: \`${branchName}\``,
            ];

            if (specDir && branchPushed) {
              lines.push(
                `**Artifact**: [\`spec.md\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${branchName}/${specDir}/spec.md)`
              );
            } else if (specDir) {
              lines.push(`**Artifact**: \`${specDir}/spec.md\``);
            }

            if (prUrl) {
              lines.push('', `**Pull Request**: ${prUrl}`);
            }

            lines.push(
              '',
              '### Next Steps',
              ''
            );

            if (prUrl) {
              lines.push(
                '1. Review the generated specification in the pull request',
                '2. Edit `spec.md` directly if changes are needed',
                '3. Merge the PR \u2192 **Phase 2 (Clarify)** will be triggered automatically'
              );
            } else if (branchPushed) {
              lines.push(
                `1. Review the generated specification on the \`${branchName}\` branch`,
                '2. Edit `spec.md` directly if changes are needed',
                '3. Create and merge a PR for this branch \u2192 **Phase 2 (Clarify)** will be triggered automatically'
              );
            } else {
              lines.push(
                '1. Artifacts were generated locally but not pushed (`SPECKIT_CREATE_BRANCH=false`)',
                '2. Re-run the workflow with `SPECKIT_CREATE_BRANCH` enabled, or push the branch and create a PR manually',
                '3. Ensure the PR has the `speckit:phase-1` label before merging (required for automatic progression)'
              );
            }

            lines.push(
              '',
              '---',
              `_This comment was posted by the [SpecKit GitHub Action](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`
            );

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: lines.join('\n')
            });

      - name: Update Labels
        if: success() && steps.validate-label.outputs.label_matches == 'true' && steps.idempotency.outputs.skipped != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue?.number || ${{ inputs.issue_number || 0 }};

            // Remove processing label (may already be absent — ignore errors)
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'speckit:processing'
              });
            } catch (e) {
              console.log('Could not remove speckit:processing label:', e.message);
            }

            // Remove speckit:failed if present (from a previous failed attempt)
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'speckit:failed'
              });
            } catch (e) {
              // Expected when label is not present — ignore
            }

            // NOTE: speckit:phase-1-complete is applied by speckit-phase-progression.yml
            // when the Phase 1 PR is merged — not here at creation time.

      - name: Post Failed Comment
        if: failure() && vars.SPECKIT_COMMENT_ON_ISSUE != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue?.number || ${{ inputs.issue_number || 0 }};

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '## ❌ SpecKit: Specification Generation Failed',
                '',
                'An error occurred while generating the specification.',
                '',
                `**Workflow Run**: [View logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                '### Troubleshooting',
                '',
                '1. Check that the issue has a descriptive title and body',
                '2. Verify that the COPILOT_GITHUB_TOKEN secret is configured with repo permissions',
                '3. Review the workflow logs for detailed error messages',
                '',
                '### Manual Alternative',
                '',
                'You can manually create a specification by running:',
                '```',
                `/speckit.specify ${context.payload.issue?.title || 'your feature description'}`,
                '```',
                '',
                '---',
                `_This comment was posted by the [SpecKit GitHub Action](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`
              ].join('\n')
            });

            // Update label: remove processing, add failed
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'speckit:processing'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['speckit:failed']
              });
            } catch (e) {
              console.log('Could not update labels:', e.message);
            }

    timeout-minutes: 30
