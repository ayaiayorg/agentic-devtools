name: SpecKit Issue Trigger

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process (for manual testing)'
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  AGDT_USE_PYTHON_ORCHESTRATOR: "1"

concurrency:
  group: speckit-trigger-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  speckit-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == vars.SPECKIT_TRIGGER_LABEL ||
      github.event.label.name == 'speckit'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install . --no-deps
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: agdt-speckit-trigger
