name: SpecKit Issue Trigger

on:
  issues:
    types: [labeled]
  workflow_dispatch: { inputs: { issue_number: { description: 'Issue number to process (for manual testing)', required: true, type: number } } }

permissions: { contents: write, issues: write, pull-requests: write }

env:
  AGDT_USE_PYTHON_ORCHESTRATOR: "1"

concurrency:
  group: speckit-trigger-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  speckit-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == vars.SPECKIT_TRIGGER_LABEL ||
      github.event.label.name == 'speckit'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Add Processing Label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue?.number || ${{ inputs.issue_number || 0 }};
            if (!issueNumber) {
              core.warning('Could not resolve issue number; skipping speckit:processing label');
              return;
            }
            try { await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, labels: ['speckit:processing'] }); }
            catch (error) { core.warning(`Failed to add speckit:processing label to issue #${issueNumber}: ${error.message}`); }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install github-copilot-sdk
          python -m pip install . --no-deps
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SPECKIT_TRIGGER_LABEL: ${{ vars.SPECKIT_TRIGGER_LABEL || 'speckit' }}
        run: agdt-speckit-trigger

      - name: Handle Failure (Comment + Label)
        if: failure()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER_INPUT: ${{ inputs.issue_number || '' }}
          TRIGGER_LABEL: ${{ vars.SPECKIT_TRIGGER_LABEL || 'speckit' }}
        with:
          script: |
            const dispatchIssueNumber = Number.parseInt(process.env.ISSUE_NUMBER_INPUT || '0', 10);
            const issueNumber = context.payload.issue?.number || (Number.isFinite(dispatchIssueNumber) ? dispatchIssueNumber : 0);
            if (!issueNumber) return;
            const triggerLabel = process.env.TRIGGER_LABEL || 'speckit';
            const retriggerLabelInstructions = triggerLabel === 'speckit'
              ? `3. You can re-trigger by removing the \`speckit:failed\` label and re-adding the \`speckit\` label, or use the **workflow_dispatch** trigger on the [SpecKit Issue Trigger workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/speckit-issue-trigger.yml)`
              : `3. You can re-trigger by removing the \`speckit:failed\` label and re-adding the \`${triggerLabel}\` label (legacy: \`speckit\`), or use the **workflow_dispatch** trigger on the [SpecKit Issue Trigger workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/speckit-issue-trigger.yml)`;

            const body = [
              '## ❌ SpecKit: Trigger Failed',
              '',
              'An error occurred while running the SpecKit trigger workflow.',
              '',
              `**Workflow Run**: [View logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '### Troubleshooting',
              '',
              '1. Check the workflow logs for detailed error messages',
              '2. Verify that the COPILOT_GITHUB_TOKEN secret is configured with repo permissions',
              retriggerLabelInstructions,
              '',
              '---',
              `_This comment was posted by the [SpecKit GitHub Action](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`
            ].join('\n');

            // Post failure comment (respects SPECKIT_COMMENT_ON_ISSUE)
            const commentOnIssue = '${{ vars.SPECKIT_COMMENT_ON_ISSUE }}' !== 'false';
            if (commentOnIssue) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: body
                });
              } catch (e) {
                console.log('Could not post failure comment:', e.message);
              }
            }

            // Add failed label (always, regardless of comment setting)
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['speckit:failed']
              });
            } catch (e) {
              console.log('Could not add speckit:failed label:', e.message);
            }

            // Remove processing label on failure
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'speckit:processing'
              });
            } catch (e) {
              // Label may not exist — that's fine
            }
