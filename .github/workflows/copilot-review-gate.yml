name: Copilot Review Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  copilot-review-gate:
    name: Copilot Review ✅
    permissions:
      contents: read
      pull-requests: read
      actions: write    # only this job needs actions:write (for re-running stale checks)
    # pull_request_review does not support a branches filter, so guard at job level.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Copilot review
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // 1. Determine PR number and head SHA from the event payload.
            // Both pull_request and pull_request_review events include a pull_request object.
            const prNumber = context.payload.pull_request.number;
            // Always fetch the current PR state to get the latest head SHA,
            // ensuring we check against the current commit even if the event payload is stale.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const headSha = pr.head.sha;
            core.info(`PR #${prNumber}, head SHA: ${headSha}`);
            core.setOutput('head_sha', headSha);

            // 2. Fetch all reviews for the PR.
            const allReviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            // 3. Filter to Copilot reviews on the latest commit.
            const copilotLogin = 'copilot-pull-request-reviewer[bot]';
            const copilotReviews = allReviews.filter(
              r => r.user && r.user.login === copilotLogin && r.commit_id === headSha
            );

            // 4. If no Copilot review found on the latest commit, fail.
            if (copilotReviews.length === 0) {
              core.setFailed(
                `❌ No Copilot code review found for the latest commit (${headSha}).\n` +
                `Request a review from Copilot or wait for the automatic review to complete.`
              );
              return;
            }

            // 5. Sort reviews by submitted_at to find the latest.
            // Copilot may submit multiple reviews per commit:
            //   - Multiple reviews in one session (code review + overview)
            //   - A re-review after issues are addressed
            // The latest review body reflects the current state — a re-review
            // saying "no new comments" supersedes earlier reviews that found issues.
            copilotReviews.sort((a, b) =>
              new Date(b.submitted_at) - new Date(a.submitted_at)
            );
            const latestReview = copilotReviews[0];

            core.info(`Found ${copilotReviews.length} Copilot review(s) on head commit.`);
            for (const r of copilotReviews) {
              core.info(
                `  Review ${r.id} (${r.submitted_at}): ` +
                `body length ${(r.body || '').length} chars` +
                (r.id === latestReview.id ? ' [latest]' : '')
              );
            }

            // 6. Parse the LATEST review body for comment and suppressed counts.
            // Only the latest review is used because a re-review supersedes
            // earlier ones — "generated no new comments" means prior issues
            // have been addressed.
            const latestBody = latestReview.body || '';
            let bodyCommentCount = null;
            let suppressedCount = 0;

            // Match both "generated no comments" and "generated no new comments"
            // (Copilot uses "no new comments" on re-reviews).
            if (/generated no( new)? comments/i.test(latestBody)) {
              bodyCommentCount = 0;
            } else {
              const generatedMatch = latestBody.match(/generated (\d+) comment/i);
              if (generatedMatch) {
                bodyCommentCount = parseInt(generatedMatch[1], 10);
              }
            }

            const suppressedMatch = latestBody.match(/[Ss]uppressed[^.(]*\((\d+)\)/);
            if (suppressedMatch) {
              suppressedCount = parseInt(suppressedMatch[1], 10);
            } else {
              const lowConfMatch = latestBody.match(/[Ll]ow confidence[^.(]*\((\d+)\)/);
              if (lowConfMatch) {
                suppressedCount = parseInt(lowConfMatch[1], 10);
              }
            }

            // 7. Determine the posted comment count.
            // Trust the latest review body when parseable. Fall back to API
            // comment count (aggregated across all reviews) only when the
            // body format is unrecognized.
            let postedCommentCount;
            if (bodyCommentCount !== null) {
              core.info(`Latest review body reports ${bodyCommentCount} comment(s).`);
              postedCommentCount = bodyCommentCount;
            } else {
              core.warning(
                'Could not parse comment count from latest review body — ' +
                'falling back to API comment count.'
              );
              let totalApiComments = 0;
              for (const review of copilotReviews) {
                const reviewComments = await github.paginate(
                  github.rest.pulls.listCommentsForReview,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    review_id: review.id,
                    per_page: 100,
                  }
                );
                const count = reviewComments.filter(
                  c => c.user && c.user.login === copilotLogin
                ).length;
                if (count > 0) {
                  core.info(`  Review ${review.id}: ${count} API comment(s)`);
                }
                totalApiComments += count;
              }
              postedCommentCount = totalApiComments;
            }

            const totalComments = postedCommentCount + suppressedCount;

            // 8. Decision.
            if (totalComments === 0) {
              core.info(
                `✅ Copilot reviewed the latest commit and generated 0 comments ` +
                `(including 0 suppressed) across ${copilotReviews.length} review(s). All clear!`
              );
            } else {
              core.setFailed(
                `❌ Copilot review found issues on commit ${headSha}.\n` +
                `- Reviews on commit: ${copilotReviews.length}\n` +
                `- Comments posted: ${postedCommentCount}\n` +
                `- Comments suppressed (low confidence): ${suppressedCount}\n` +
                `Please address all Copilot feedback (including suppressed low-confidence comments), push a new commit, and wait for Copilot to re-review.`
              );
            }

      # When triggered by a pull_request_review event, the companion (pull_request)
      # check may still show a stale failure from before the Copilot review existed.
      # Re-running it ensures both required checks reflect the current review status.
      # Best-effort: API errors (fork restrictions, rate limits) must not fail the gate.
      - name: Re-run stale pull_request check
        if: success() && github.event_name == 'pull_request_review'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = '${{ steps.check.outputs.head_sha }}';
            const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'copilot-review-gate.yml',
              event: 'pull_request',
              head_sha: headSha,
              // A single head SHA rarely produces more than one or two runs.
              per_page: 10,
            });

            const failed = runs.filter(r => r.conclusion === 'failure');
            if (failed.length === 0) {
              core.info('No failed pull_request checks to re-run.');
              return;
            }

            for (const run of failed) {
              core.info(
                `Re-running pull_request workflow run ${run.id} ` +
                `(conclusion: ${run.conclusion})`
              );
              await github.rest.actions.reRunWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
            }
            core.info(`Re-run triggered for ${failed.length} workflow run(s).`);
