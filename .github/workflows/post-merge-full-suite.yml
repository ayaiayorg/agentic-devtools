name: Post-Merge Full Suite

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node.js (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate 1:1:1 test structure
        run: |
          python scripts/validate_test_structure.py

      - name: Run full pytest with coverage
        run: |
          pytest --cov=agentic_devtools --cov-report=term-missing --cov-fail-under=100 --ignore=tests/workflows

      - name: Run workflow integration tests
        run: |
          pytest tests/workflows/ -v --override-ini="addopts="

      - name: Run E2E smoke tests
        run: |
          pytest tests/e2e_smoke/ -v --no-cov

      - name: ruff check
        run: |
          ruff check .

      - name: ruff format check
        run: |
          ruff format --check .

      - name: markdownlint
        run: |
          npx markdownlint-cli2 "**/*.md"

      - name: mypy type checking
        run: |
          mypy .
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
