name: Workflow Approval Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  pull-requests: read
  issues: write
  contents: read

concurrency:
  group: workflow-approval-monitor
  cancel-in-progress: true

jobs:
  approve-trusted-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve stuck workflow runs from trusted bots
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fullRepo = `${owner}/${repo}`;
            const nowMs = Date.now();

            // Load trusted bot accounts from config
            let trustedAccounts = [];
            let stuckThresholdMinutes = 5;
            try {
              const configContent = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.github/ai-pr-loop-config.json',
              });
              const config = JSON.parse(Buffer.from(configContent.data.content, 'base64').toString());
              if (!Array.isArray(config.trusted_bot_accounts)) {
                throw new Error('trusted_bot_accounts must be an array');
              }
              if (
                !config.trusted_bot_accounts.every(
                  (account) => typeof account === 'string' && account.trim().length > 0,
                )
              ) {
                throw new Error('trusted_bot_accounts must contain only non-empty strings');
              }
              trustedAccounts = config.trusted_bot_accounts;
              if (
                typeof config.stuck_threshold_minutes === 'number' &&
                Number.isFinite(config.stuck_threshold_minutes) &&
                config.stuck_threshold_minutes >= 0
              ) {
                stuckThresholdMinutes = config.stuck_threshold_minutes;
              }
            } catch (e) {
              core.warning(`Could not load/validate .github/ai-pr-loop-config.json; skipping approvals (fail closed): ${e.message}`);
              return;
            }

            core.info(`Trusted accounts: ${trustedAccounts.join(', ')}`);
            core.info(`Stuck threshold: ${stuckThresholdMinutes} minute(s)`);
            const trustedAccountSet = new Set(trustedAccounts.map((account) => account.toLowerCase()));

            const listActionRequiredRuns = async () => {
              const workflowRuns = [];
              for (let page = 1; ; page++) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  status: 'action_required',
                  per_page: 100,
                  page,
                });
                workflowRuns.push(...(data.workflow_runs || []));
                if (!data.workflow_runs || data.workflow_runs.length < 100) {
                  break;
                }
              }
              return workflowRuns;
            };

            const hasFailureMarkerComment = async (prNumber, marker) => {
              for (let page = 1; ; page++) {
                const { data: comments } = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number: prNumber,
                  per_page: 100,
                  page,
                });
                if (comments.some((comment) => (comment.body || '').includes(marker))) {
                  return true;
                }
                if (comments.length < 100) {
                  return false;
                }
              }
            };

            const runs = await listActionRequiredRuns();
            if (runs.length === 0) {
              core.info('No workflow runs awaiting approval.');
              return;
            }

            core.info(`Found ${runs.length} run(s) awaiting approval.`);

            let approved = 0;
            let skipped = 0;
            let failed = 0;

            for (const run of runs) {
              const prNumber = run.pull_requests?.[0]?.number;
              if (!prNumber) {
                core.info(`Skipping run ${run.id} — no associated PR.`);
                skipped++;
                continue;
              }

              let prData;
              try {
                const prResponse = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                prData = prResponse.data;
              } catch (e) {
                core.warning(`Skipping run ${run.id} — could not load PR #${prNumber}: ${e.message}`);
                skipped++;
                continue;
              }

              const prAuthor = (prData.user?.login || '').toLowerCase();
              if (!trustedAccountSet.has(prAuthor)) {
                core.info(`Skipping run ${run.id} — PR author '${prAuthor}' not in trusted list.`);
                skipped++;
                continue;
              }

              const baseRepo = prData.base?.repo?.full_name || '';
              const headRepo = prData.head?.repo?.full_name || '';
              if (baseRepo !== fullRepo || headRepo !== fullRepo) {
                core.info(
                  `Skipping run ${run.id} — PR #${prNumber} is not same-repo (base='${baseRepo}', head='${headRepo}').`,
                );
                skipped++;
                continue;
              }

              const ageSource = run.updated_at || run.run_started_at || run.created_at;
              const ageMinutes = ageSource ? (nowMs - new Date(ageSource).getTime()) / 60000 : Number.POSITIVE_INFINITY;
              if (ageMinutes < stuckThresholdMinutes) {
                core.info(
                  `Skipping run ${run.id} — action_required for ${ageMinutes.toFixed(1)} minute(s), below threshold.`,
                );
                skipped++;
                continue;
              }

              const marker = `<!-- workflow-approval-monitor:pr-${prNumber}:sha-${run.head_sha} -->`;
              if (await hasFailureMarkerComment(prNumber, marker)) {
                core.info(`Skipping run ${run.id} — already exhausted retries for PR #${prNumber} @ ${run.head_sha}.`);
                skipped++;
                continue;
              }

              // Approve the run with retry (up to 3 attempts per NFR-006)
              let success = false;
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  await github.rest.actions.approveWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  core.info(`Approved run ${run.id} (prAuthor: ${prAuthor}, attempt ${attempt}).`);
                  success = true;
                  break;
                } catch (e) {
                  core.warning(`Attempt ${attempt}/3 to approve run ${run.id} failed: ${e.message}`);
                  if (attempt < 3) {
                    await new Promise(r => setTimeout(r, 2000));
                  }
                }
              }

              if (success) {
                approved++;
              } else {
                failed++;
                try {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: prNumber,
                    body:
                      `${marker}\n` +
                      `⚠️ **Workflow Approval Monitor**: Failed to auto-approve workflow run [${run.id}](${run.html_url}) after 3 attempts for \`${run.head_sha}\`. ` +
                      `Further retries for this PR/SHA are suppressed. Manual approval may be required.`,
                  });
                } catch (commentError) {
                  core.warning(`Failed to post failure comment on PR #${prNumber}: ${commentError.message}`);
                }
              }
            }

            core.info(`Summary: approved=${approved}, skipped=${skipped}, failed=${failed}`);
            if (failed > 0) {
              core.warning(`${failed} run(s) could not be approved after 3 retries.`);
            }
