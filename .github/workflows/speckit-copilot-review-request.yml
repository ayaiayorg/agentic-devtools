name: SpecKit Copilot Review Request

# Dedicated workflow to request a Copilot review on implementation PRs created
# asynchronously by the Copilot coding agent. Spec PRs request the review inline
# from speckit-issue-trigger.yml / speckit-phase-progression.yml; this workflow
# only handles implementation PRs which are created *after* agent assignment.
#
# Triggers:
#   - opened: PRs authored by copilot-swe-agent[bot]
#   - labeled: PRs that just received the speckit:implementation label
#
# Related: #1196

on:
  pull_request:
    branches:
      - main
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: speckit-copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-copilot-review:
    name: Request Copilot Review
    runs-on: ubuntu-latest
    # Job-level gate: run for opened events authored by copilot-swe-agent[bot],
    # or for labeled events where the added label is exactly speckit:implementation.
    # Using a job-level `if` (rather than per-step) keeps the run list clean and
    # avoids spinning up a runner for unrelated label events.
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      (
        (github.event.action == 'opened' &&
         github.event.pull_request.user.login == 'copilot-swe-agent[bot]') ||
        (github.event.action == 'labeled' &&
         github.event.label.name == 'speckit:implementation')
      )

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # Idempotency guard: avoid re-requesting the reviewer when Copilot is
      # already a requested reviewer or has already reviewed this PR. This
      # makes repeated `labeled` events safe.
      - name: Check existing reviewers
        id: idempotency
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const copilotLogin = 'copilot-pull-request-reviewer[bot]';

            try {
              // 1. Check currently requested reviewers.
              const { data: requested } = await github.rest.pulls.listRequestedReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              const alreadyRequested = (requested.users || []).some(u => u.login === copilotLogin);

              // 2. Check whether Copilot has already submitted any review.
              //    An existing review also satisfies the "already on this PR" check.
              let alreadyReviewed = false;
              if (!alreadyRequested) {
                const reviews = await github.paginate(github.rest.pulls.listReviews, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  per_page: 100,
                });
                alreadyReviewed = reviews.some(r => r.user && r.user.login === copilotLogin);
              }

              const alreadyOnPr = alreadyRequested || alreadyReviewed;
              core.info(
                `Copilot review state for PR #${prNumber}: ` +
                `requested=${alreadyRequested}, reviewed=${alreadyReviewed}`
              );
              core.setOutput('already_requested', alreadyOnPr ? 'true' : 'false');
            } catch (error) {
              core.warning(
                `Unable to determine Copilot review state for PR #${prNumber}; ` +
                `continuing and allowing review request attempt. Error: ${error.message}`
              );
              core.setOutput('already_requested', 'false');
            }

      - name: Request Copilot Review
        id: request-copilot-review
        if: steps.idempotency.outputs.already_requested != 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: ['copilot-pull-request-reviewer'],
              });
              core.info(`Requested Copilot review on PR #${prNumber}`);
              core.setOutput('copilot_review_requested', 'true');
            } catch (e) {
              const message = String(e && e.message ? e.message : e);
              const responseMessage = e.response?.data?.message || '';
              const responseErrors = Array.isArray(e.response?.data?.errors)
                ? e.response.data.errors
                    .map((error) =>
                      typeof error === 'string' ? error : JSON.stringify(error)
                    )
                    .join(' ')
                : '';
              const combinedMessage = `${message} ${responseMessage} ${responseErrors}`.toLowerCase();
              const isAlreadyRequested422 =
                e.status === 422 &&
                (
                  combinedMessage.includes('already requested') ||
                  combinedMessage.includes('already a reviewer')
                );

              if (isAlreadyRequested422) {
                core.info(
                  `Copilot review was already requested on PR #${prNumber}; treating 422 response as success.`
                );
                core.setOutput('copilot_review_requested', 'true');
              } else {
                core.warning(
                  `Failed to request Copilot review on PR #${prNumber}: ${message}`
                );
                core.setOutput('copilot_review_requested', 'false');
              }
            }

      - name: Extract Linked Issue Number
        id: linked-issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const haystack = `${pr.title || ''}\n${pr.body || ''}`;
            const match = haystack.match(/#(\d+)/);
            const issueNumber = match ? match[1] : '';
            if (issueNumber) {
              core.info(`Extracted linked issue #${issueNumber} from PR #${pr.number}`);
            } else {
              core.info(`No linked issue reference found in PR #${pr.number}`);
            }
            core.setOutput('issue_number', issueNumber);

      - name: Post Review Request Status on Linked Issue
        if: steps.linked-issue.outputs.issue_number != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.linked-issue.outputs.issue_number }}', 10);
            const prNumber = context.payload.pull_request.number;
            const alreadyRequested = '${{ steps.idempotency.outputs.already_requested }}' === 'true';
            const requested = '${{ steps.request-copilot-review.outputs.copilot_review_requested }}' === 'true';

            // Build status line.
            let statusLine;
            if (alreadyRequested) {
              statusLine = `🤖 Copilot review already requested on PR #${prNumber}`;
            } else if (requested) {
              statusLine = `🤖 Copilot review requested on PR #${prNumber}`;
            } else {
              statusLine = `⚠️ Copilot review request failed on PR #${prNumber}`;
            }

            // Marker used to detect a prior status comment posted by this
            // workflow for the same PR, so repeated runs (e.g. label events
            // after the initial `opened` event) update rather than duplicate.
            const marker = `<!-- speckit-copilot-review-request:pr-${prNumber} -->`;
            const body = [
              marker,
              '## SpecKit: Copilot Review Request',
              '',
              statusLine,
              '',
              '---',
              `_Posted by [SpecKit Copilot Review Request](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`,
            ].join('\n');

            // Duplicate-detection: look for an existing comment containing the marker.
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const priorComment = existing.find(c => (c.body || '').includes(marker));

            try {
              if (priorComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: priorComment.id,
                  body,
                });
                core.info(`Updated existing status comment on issue #${issueNumber}`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body,
                });
                core.info(`Posted new status comment on issue #${issueNumber}`);
              }
            } catch (e) {
              core.warning(
                `Failed to post status comment on issue #${issueNumber}: ${e.message}`
              );
            }
