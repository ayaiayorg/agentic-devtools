# Spec-Kit Configuration
# See: https://github.github.io/spec-kit/reference/configuration.html
#
# This file references local extension and preset packages using relative paths.
# The monorepo approach keeps AGDT-specific code atomic and easier to evolve
# without cross-repo maintenance burden. See issue #1444 for rationale.
#
# NOTE: These pins will only resolve after the packages are published
# (T016/T017 in the migration tasks). Until then, `specify install` will
# fail — use repo-local .specify/scripts/ and .specify/templates/ directly.
#
# T027-T030 review status (community adoption):
# No community extension currently meets the ≥80% overlap threshold against
# `docs/speckit-migration-inventory.md`, so no additional community extension
# pins are configured. Re-evaluate after #1444 lands (monorepo local-path
# structure) or when the community catalog adds closer functional matches.

extensions:
  # AGDT-specific commands and scripts for agentic-devtools workflows
  - "./.specify/extensions/agdt-workflows"

presets:
  # AGDT-specific template overrides (spec, plan, tasks, checklist, agent-file)
  - "./.specify/presets/agdt-templates"
